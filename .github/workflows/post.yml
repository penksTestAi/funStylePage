# Posts every 2 hours with the repo's own GITHUB_TOKEN (no personal or Claude account needed).
# The post job commits and then the deploy job publishes Pages in the same run, because pushes
# made with GITHUB_TOKEN do not trigger other workflows.
name: Post new experiment

on:
  schedule:
    # Every 2 hours, on the hour (UTC). GitHub may start scheduled runs 10-30 min late.
    - cron: "0 */2 * * *"
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "experiments.json"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-experiment
  cancel-in-progress: false

jobs:
  post:
    # Runs on the schedule and by hand. A push (for example a human edit to the site) only deploys.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate a new experiment
        run: node scripts/generate.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments experiments.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Post new experiment $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy:
    needs: post
    # Runs after a manual post, or directly on a push that changed the site.
    if: ${{ always() && !cancelled() && (needs.post.result == 'success' || needs.post.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect the site files
        run: |
          mkdir -p _site
          cp index.html experiments.json _site/
          cp -r experiments _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

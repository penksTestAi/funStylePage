<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autocorrect 26 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  button:focus-visible, .x:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button[aria-disabled="true"] { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }

  .caret { animation: blink 1s steps(1) infinite; }
  .bob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .panel { max-width: 460px; margin: 16px auto; }
  .ask { background: var(--soft); border-radius: 8px; padding: 10px 12px; min-height: 2.6em; }
  textarea { box-sizing: border-box; width: 100%; min-height: 8em; font: inherit; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .stats { opacity: .85; font-size: .9rem; margin: 8px 0; min-height: 1.3em; }
  .chips { list-style: none; margin: 8px 0; padding: 0; max-height: 280px; overflow: auto; text-align: left; }
  .chips li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; background: var(--soft); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 14px; margin: 6px 0; }
  .chips .q { font-weight: 700; }
  .chips .sure { opacity: .75; font-size: .85rem; }
  .chips button { margin: 0; padding: 6px 12px; }
  .result { background: var(--soft); border: 2.5px solid var(--ink); border-radius: 16px; padding: 14px; margin: 12px 0; text-align: left; }
  .result p { margin: 6px 0; }
  .result .msg { white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 700; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A text box with a blinking cursor and a small chip above it that says did you mean, with a tick, bobbing up and down">
    <rect x="24" y="52" width="152" height="52" rx="8" style="fill: var(--paper, #fff)" stroke="currentColor" stroke-width="2.5"/>
    <path d="M38 68 h70 M38 80 h96 M38 92 h40" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <rect class="caret" x="84" y="86" width="3" height="12" fill="#1a6ef0"/>
    <g class="bob"><rect x="46" y="14" width="108" height="26" rx="13" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/>
    <path d="M62 28 l5 5 9-11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 27 h54" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g>
  </svg></div>
<h1>Autocorrect 26</h1><p class="blurb">Did you mean something slightly worse?</p>
<section class="panel" aria-label="Message box">
  <div class="ask" id="ask">Write a short message. We will take it from here.</div>
  <label class="sr" for="ta">Your message</label>
  <textarea id="ta" rows="5" placeholder="Start typing. Press space after a word." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <p class="stats" id="stats"></p>
  <ul class="chips" id="chips" aria-label="Corrections made so far"></ul>
  <div class="row">
    <button type="button" id="send">Send</button>
    <button type="button" id="demo" class="ghost">Paste an example</button>
    <button type="button" id="again" class="ghost" hidden>Write another</button>
  </div>
  <div class="result" id="result" hidden></div>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const $ = (id) => document.getElementById(id);
  const ta = $("ta");
  const PAIRS = ("their there there their your you're you're your its it's it's its affect effect effect affect " +
    "definitely defiantly lose loose loose lose then than than then quiet quite quite quiet weather whether " +
    "whether weather accept except except accept thanks tanks meeting melting tomorrow tomato hello hell " +
    "dinner sinner morning mourning lunch launch sent scent please plaice regards regrets attached attacked " +
    "form from from form great grate dear deer hope hop well wall friend fiend sincerely severely " +
    "deadline dreadline team tea project reject invoice voice should shoulder money monkey sorry sorely " +
    "important impotent figure finger").split(" ");
  const DICT = {};
  for (let i = 0; i < PAIRS.length; i += 2) DICT[PAIRS[i]] = PAIRS[i + 1];

  let fixes = [], protectedWords = new Set(), nextId = 1;
  let made = 0, restored = 0, presses = 0, typed = 0, sent = false;

  function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
  function shape(orig, w) {
    if (orig === orig.toUpperCase() && orig.length > 1) return w.toUpperCase();
    if (orig[0] !== orig[0].toLowerCase()) return w[0].toUpperCase() + w.slice(1);
    return w;
  }
  function worse(orig) {
    const k = orig.toLowerCase();
    if (protectedWords.has(k)) return null;
    let w = DICT[k];
    if (!w && k.length >= 5 && /^[a-z]+$/.test(k) && hash(k) % 2 === 0) {
      const i = 1 + hash(k + "x") % (k.length - 3);
      w = k.slice(0, i) + k[i + 1] + k[i] + k.slice(i + 2);
    }
    if (!w || w === k) return null;
    return shape(orig, w);
  }
  function sure(orig) { return 90 + hash(orig.toLowerCase()) % 10; }
  function need() { return Math.min(6, 2 + restored); }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function wordRe(w) { return new RegExp("(^|[^A-Za-z'])(" + esc(w) + ")(?![A-Za-z'])", "g"); }

  function addFix(orig, fixed) {
    fixes.push({ id: nextId++, orig, fixed, press: 0, pct: sure(orig) });
    made++;
  }
  function correctText(text) {
    return text.replace(/[A-Za-z']+/g, (w) => {
      const f = worse(w);
      if (!f) return w;
      addFix(w, f);
      return f;
    });
  }
  // drop corrections whose word is no longer in the text
  function prune() {
    const text = ta.value, used = {};
    fixes = fixes.filter((f) => {
      const key = f.fixed.toLowerCase();
      let n = 0; text.replace(wordRe(f.fixed), () => { n++; });
      let c = 0; text.toLowerCase().replace(wordRe(key), () => { c++; });
      used[key] = (used[key] || 0) + 1;
      return used[key] <= Math.max(n, c);
    });
  }
  function say(m) { $("ask").textContent = m; $("live").textContent = m; }

  let before = "";
  ta.addEventListener("beforeinput", () => { before = ta.value; });
  ta.addEventListener("input", (e) => {
    if (sent) return;
    if (e.inputType === "insertText") typed++;
    if (e.inputType === "insertFromPaste") {
      // correct only the pasted part, so words we already corrected are not corrected twice
      let a = 0; while (a < before.length && a < ta.value.length && before[a] === ta.value[a]) a++;
      let b = 0; while (b < before.length - a && b < ta.value.length - a && before[before.length - 1 - b] === ta.value[ta.value.length - 1 - b]) b++;
      const end = ta.value.length - b, fixed = correctText(ta.value.slice(a, end));
      ta.value = ta.value.slice(0, a) + fixed + ta.value.slice(end);
      ta.setSelectionRange(a + fixed.length, a + fixed.length);
    } else if ((e.inputType === "insertText" && /^[\s.,!?;:]$/.test(e.data || "")) || e.inputType === "insertLineBreak") {
      const p = ta.selectionStart, before = ta.value.slice(0, p - 1), m = /[A-Za-z']+$/.exec(before);
      if (m) {
        const f = worse(m[0]);
        if (f) {
          const start = m.index;
          ta.value = ta.value.slice(0, start) + f + ta.value.slice(start + m[0].length);
          const np = p + (f.length - m[0].length);
          ta.setSelectionRange(np, np);
          addFix(m[0], f);
          say("Did you mean \u201c" + f + "\u201d? We are " + fixes[fixes.length - 1].pct + "% sure you did.");
        }
      }
    }
    prune(); render();
  });

  function render(focusId) {
    const ul = $("chips");
    ul.textContent = "";
    const n = need();
    fixes.slice().reverse().forEach((f) => {
      const li = document.createElement("li");
      const t = document.createElement("span");
      t.innerHTML = '<span class="q"></span> <span class="sure"></span>';
      t.firstChild.textContent = "Did you mean \u201c" + f.fixed + "\u201d?";
      t.lastChild.textContent = "(" + f.pct + "% sure)";
      const b = document.createElement("button");
      b.type = "button"; b.className = "ghost"; b.dataset.id = f.id;
      b.textContent = f.press === 0 ? "No, I meant " + f.orig + " (" + n + " presses)" : "Still no (" + (n - f.press) + " more)";
      b.onclick = () => undo(f.id);
      li.append(t, b); ul.appendChild(li);
    });
    $("stats").textContent = made === 0 ? "" : "Corrected " + made + ". Restored " + restored + ". Undo presses " + presses + ". Next undo costs " + n + ".";
    if (focusId) { const b = ul.querySelector('button[data-id="' + focusId + '"]'); if (b) b.focus(); else ta.focus(); }
  }

  function undo(id) {
    const f = fixes.find((x) => x.id === id);
    if (!f || sent) return;
    f.press++; presses++;
    const n = need();
    if (f.press < n) {
      const left = n - f.press;
      say(["Are you sure? \u201c" + f.fixed + "\u201d is " + f.pct + "% likely. " + left + " more.",
           "Noted, and ignored. " + left + " more.",
           "Most people who press this meant \u201c" + f.fixed + "\u201d. " + left + " more.",
           "Hold on, we are checking with the dictionary. " + left + " more."][(f.press - 1) % 4]);
      render(id); return;
    }
    const k = f.orig.toLowerCase();
    const re = wordRe(f.fixed);
    let last = null, m;
    while ((m = re.exec(ta.value))) last = m;
    if (last) {
      const s = last.index + last[1].length;
      ta.value = ta.value.slice(0, s) + f.orig + ta.value.slice(s + f.fixed.length);
    }
    fixes = fixes.filter((x) => x.id !== id);
    restored++; protectedWords.add(k);
    say("Fine. \u201c" + f.orig + "\u201d is back, and we have learned it. The next undo costs " + need() + ".");
    prune(); render();
    ta.focus();
  }

  $("demo").onclick = () => {
    if (sent) return;
    ta.value = (ta.value ? ta.value + " " : "") + correctText("Dear team, thanks for the meeting. Your project is definitely important, so please send the invoice tomorrow.");
    prune(); render(); say("Pasted, and corrected on the way in.");
    ta.focus();
  };

  $("send").onclick = () => {
    const words = (ta.value.match(/[A-Za-z']+/g) || []);
    if (!words.length) { say("There is nothing to send. We have corrected that for you."); ta.focus(); return; }
    sent = true; ta.readOnly = true;
    prune();
    const left = fixes.length, acc = Math.round((words.length - left) / words.length * 1000) / 10;
    const r = $("result");
    r.hidden = false; r.textContent = "";
    const add = (cls, txt) => { const p = document.createElement("p"); if (cls) p.className = cls; p.textContent = txt; r.appendChild(p); };
    add("", "Delivered, exactly as you wrote it:");
    add("msg", ta.value);
    add("", words.length + " words. " + made + " corrected, " + restored + " put back by you, " + left + " delivered corrected.");
    add("", "Accuracy: " + acc.toFixed(1) + "%. " + presses + " undo press" + (presses === 1 ? "" : "es") + " and " + typed + " keystrokes spent" + (restored ? ", " + (presses / restored).toFixed(1) + " presses per word saved." : ", none of it saved a word."));
    $("send").hidden = true; $("demo").hidden = true; $("again").hidden = false; $("chips").hidden = true;
    say("Sent. Accuracy " + acc.toFixed(1) + "%.");
    $("again").focus();
  };

  $("again").onclick = () => {
    sent = false; ta.readOnly = false; ta.value = "";
    fixes = []; protectedWords = new Set(); made = restored = presses = typed = 0;
    $("result").hidden = true; $("again").hidden = true; $("send").hidden = false; $("demo").hidden = false; $("chips").hidden = false;
    render(); say("Write a short message. We will take it from here."); ta.focus();
  };
  render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select all · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse { transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  .stage { margin: 20px auto 8px; max-width: 320px; text-align: left; }
  .list { background: var(--soft); border-radius: 10px; padding: 8px 14px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 1.1rem; cursor: pointer; }
  .opt.kid { margin-left: 28px; }
  .opt.all { font-weight: 700; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
  .opt input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; cursor: pointer; }
  .opt input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .count { font-variant-numeric: tabular-nums; opacity: .8; margin: 10px 0 0; min-height: 1.4em; }
  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A large checked box above four small boxes, one of them tipping over, with a tick drifting between them">
    <g class="wobble"><rect x="20" y="14" width="40" height="40" rx="8" fill="#2bb673" stroke="currentColor" stroke-width="2.5"/><path d="M29 35l8 8 15-18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g><rect x="76" y="70" width="22" height="22" rx="5" class="sheet" stroke="currentColor" stroke-width="2.5"/><path d="M81 81l4 4 7-9" fill="none" stroke="#1a6ef0" stroke-width="3" stroke-linecap="round"/></g>
    <g class="roll"><rect x="106" y="70" width="22" height="22" rx="5" class="sheet" stroke="currentColor" stroke-width="2.5"/></g>
    <g class="bob"><rect x="136" y="70" width="22" height="22" rx="5" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/><path d="M141 81l4 4 7-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g>
    <g class="pulse"><rect x="166" y="70" width="22" height="22" rx="5" class="sheet" stroke="#ff5c8a" stroke-width="2.5"/></g>
    <path d="M60 34h60M120 34v28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 5" stroke-linecap="round"/>
  </svg></div>
<h1>Select all</h1><p class="blurb">One box to select everything. Four boxes with their own views.</p>
<div class="goal" id="goal">Tick all four, and have the top box agree.</div>
<div class="stage"><div class="list" role="group" aria-label="Export">
  <label class="opt all"><input type="checkbox" id="all"> Select all</label>
  <label class="opt kid"><input type="checkbox" class="k"> Photos</label>
  <label class="opt kid"><input type="checkbox" class="k"> Contacts</label>
  <label class="opt kid"><input type="checkbox" class="k"> Calendar</label>
  <label class="opt kid"><input type="checkbox" class="k"> Messages</label>
</div><div class="count" id="count" aria-live="polite"></div></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Click, or Tab and press Space or Enter. Up and Down move between boxes.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  const all = $("all"), kids = [...document.querySelectorAll(".k")], boxes = [all, ...kids];
  const NAMES = ["Photos", "Contacts", "Calendar", "Messages"];
  const QUIRKS = 5; // presses that misbehave, then it is right
  let c, shown, presses, timers, done;
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const sync = () => { shown = { all: c.every(Boolean), kids: c.slice(), n: c.filter(Boolean).length }; };
  // Only ever sets properties on the existing inputs, so keyboard focus never moves.
  function paint() {
    kids.forEach((k, i) => { k.checked = shown.kids[i]; });
    all.checked = shown.all; all.indeterminate = !!shown.mixed;
    $("count").textContent = shown.n + " of 4 selected";
  }
  function press(k) {
    const p = presses++;
    if (k < 0) { const allOn = c.every(Boolean); c = c.map(() => !allOn); }
    else c[k] = !c[k];
    const m = $("msg");
    if (p === 0) { m.textContent = "Done. The boxes will catch up."; }
    else {
      sync();
      if (p === 1) { const j = k < 0 ? 0 : (k + 1) % 4; c[j] = false; sync(); m.textContent = NAMES[j] + " was unchecked by its neighbour. It was crowded."; }
      else if (p === 2) {
        m.textContent = "Fine for now.";
        timers.push(setTimeout(() => { if (done) return; const j = c.lastIndexOf(true); if (j < 0) return; c[j] = false; sync(); paint(); m.textContent = NAMES[j] + " changed its mind."; }, 900));
      }
      else if (p === 3) { shown.all = !shown.all; m.textContent = "Select all disagrees with everyone."; }
      else if (p === 4) { shown = prev; m.textContent = "That is what it said last time."; }
      else { shown.mixed = shown.n > 0 && shown.n < 4; if (shown.mixed) shown.all = false; m.textContent = ""; }
    }
    prev = shown;
    paint();
    if (p >= QUIRKS && c.every(Boolean)) win();
  }
  let prev;
  function win() {
    if (done) return; done = true;
    $("msg").textContent = "Four of four. Select all agrees. Nobody checked with anybody.";
    $("goal").textContent = "Right at last.";
    const r = all.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2);
  }
  boxes.forEach((b, i) => {
    b.addEventListener("click", () => press(i - 1));
    b.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); b.click(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); boxes[(i + (e.key === "ArrowDown" ? 1 : 4)) % 5].focus(); }
    });
  });
  function start() {
    clear(); c = [false, false, false, false]; presses = 0; done = false; timers = [];
    sync(); prev = shown; paint();
    $("msg").textContent = ""; $("goal").textContent = "Tick all four, and have the top box agree.";
  }
  $("reset").onclick = start;
  timers = [];
  start();
</script>
</body>
</html>

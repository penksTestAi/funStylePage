<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domino 20 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --good: #1b7d4c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --good: #5fd39a; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --good: #5fd39a; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.backlink { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .spin { animation: spin 5s linear infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  .spin, .roll, .pulse { transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  .lean { animation: lean 2.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 100%; }
  .wob { animation: wob 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
  @keyframes lean { to { transform: rotate(14deg); } }
  @keyframes wob { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .stage { max-width: 560px; margin: 16px auto; }
  #floor { width: 100%; height: auto; display: block; background: var(--soft); border-radius: 8px; touch-action: none; cursor: pointer; user-select: none; }
  #floor:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .dom { transform-box: fill-box; transform-origin: 100% 100%; transition: transform .22s cubic-bezier(.5,0,.9,.6); }
  .dom.down { transform: rotate(78deg); }
  .bell { transform-box: fill-box; transform-origin: 50% 0; }
  .bell.ring { animation: ring .9s ease-out; }
  @keyframes ring { 0% { transform: rotate(0); } 15% { transform: rotate(-22deg); } 35% { transform: rotate(18deg); } 55% { transform: rotate(-10deg); } 75% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
  .status { min-height: 1.5em; margin: 12px 0 4px; }
  .status.done { color: var(--good); font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .dom { transition: none; } }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A row of dominoes, the first ones already leaning over, with a small bell at the far end">
    <path d="M14 104 H186" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect class="lean" x="26" y="58" width="12" height="46" rx="2" fill="var(--paper)" stroke="currentColor" stroke-width="2.5"/>
    <rect class="lean d2" x="54" y="58" width="12" height="46" rx="2" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/>
    <rect x="82" y="58" width="12" height="46" rx="2" fill="var(--paper)" stroke="currentColor" stroke-width="2.5"/>
    <rect x="110" y="58" width="12" height="46" rx="2" fill="#ff5c8a" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="88" cy="72" r="2.5" fill="currentColor"/><circle cx="88" cy="90" r="2.5" fill="currentColor"/><circle cx="116" cy="72" r="2.5" fill="currentColor"/><circle cx="116" cy="90" r="2.5" fill="currentColor"/>
    <g class="wob"><path d="M148 74 C148 56 172 56 172 74 V80 H148 Z" fill="#ffb020" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="160" cy="86" r="3" fill="currentColor"/></g>
  </svg></div>
<h1>Domino 20</h1><p class="blurb">Set them up. Tip the first one.</p>
<section class="stage" aria-label="A floor for dominoes">
  <svg id="floor" viewBox="0 0 480 150" tabindex="0" role="group"></svg>
  <p class="status" id="status"></p>
  <div class="row"><button type="button" id="tip">Tip the first one</button><button type="button" id="stand" class="ghost">Stand them up</button><button type="button" id="clear" class="ghost">Pick them all up</button></div>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="backlink" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const NS = "http://www.w3.org/2000/svg", N = 20, FLOOR = 124, GAP = 2;
  const svg = document.getElementById("floor"), status = document.getElementById("status"), live = document.getElementById("live");
  const tipB = document.getElementById("tip"), standB = document.getElementById("stand"), clearB = document.getElementById("clear");
  const COL = ["#ffb020", "#ff5c8a", "#2bb673", "#6aa8ff"];
  const sx = (i) => 30 + i * 21;
  let on = new Set([2, 3, 4, 5, 6, 12]), fallen = new Set(), busy = false, cur = 0, paint = null, timers = [], rung = false;
  const doms = [];
  function el(n, a, p) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }
  function build() {
    el("line", { x1: 14, x2: 466, y1: FLOOR, y2: FLOOR, stroke: "currentColor", "stroke-width": 3, "stroke-linecap": "round" });
    for (let i = 0; i < N; i++) el("line", { x1: sx(i), x2: sx(i), y1: FLOOR + 6, y2: FLOOR + 12, stroke: "currentColor", "stroke-width": 2, opacity: .35, "stroke-linecap": "round" });
    window.ghost = el("rect", { y: FLOOR - 50, width: 12, height: 50, rx: 2, fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-dasharray": "4 3" });
    for (let i = 0; i < N; i++) {
      const g = el("g", { class: "dom" });
      el("rect", { x: sx(i) - 6, y: FLOOR - 46, width: 12, height: 46, rx: 2, fill: i % 2 ? COL[i % 4] : "var(--paper)", stroke: "currentColor", "stroke-width": 2.5 }, g);
      el("circle", { cx: sx(i), cy: FLOOR - 33, r: 2.3, fill: "currentColor" }, g);
      el("circle", { cx: sx(i), cy: FLOOR - 13, r: 2.3, fill: "currentColor" }, g);
      el("line", { x1: sx(i) - 6, x2: sx(i) + 6, y1: FLOOR - 23, y2: FLOOR - 23, stroke: "currentColor", "stroke-width": 1.5 }, g);
      doms.push(g);
    }
    // The bell sits low enough that a falling domino can reach it (the ring rule below depends on that).
    const b = el("g", { class: "bell", id: "bell" }, el("g", { transform: "translate(0 36)" }));
    el("path", { d: "M443 " + (FLOOR - 52) + " C443 " + (FLOOR - 80) + " 475 " + (FLOOR - 80) + " 475 " + (FLOOR - 52) + " V" + (FLOOR - 44) + " H443 Z", fill: "#ffb020", stroke: "currentColor", "stroke-width": 2.5, "stroke-linejoin": "round" }, b);
    el("circle", { cx: 459, cy: FLOOR - 38, r: 3.5, fill: "currentColor" }, b);
    el("rect", { x: 455, y: FLOOR - 38, width: 8, height: 38, fill: "currentColor", opacity: .0 }, b);
    svg.setAttribute("aria-label", "Domino floor with " + N + " places and a bell at the end. Arrow keys move along the floor. Enter or Space puts a domino down or picks it up.");
    status.textContent = startText();
  }
  function say(s, done) { status.textContent = s; live.textContent = s; status.classList.toggle("done", !!done); }
  function chainOf(list) {
    const chain = [list[0]];
    for (let k = 1; k < list.length && list[k] - chain[chain.length - 1] <= GAP; k++) chain.push(list[k]);
    return chain;
  }
  function startText() {
    const list = [...on].sort((a, b) => a - b), row = chainOf(list).length, far = list.length - row;
    if (!far) return on.size + " are standing in a row.";
    return on.size + " are standing. " + row + " in a row, " + (far === 1 ? "one" : far) + " a long way off.";
  }
  // A button that is about to be disabled would drop keyboard focus to the page top; hand it to the floor instead.
  function keep(b) { if (document.activeElement === b) svg.focus({ preventScroll: true }); }
  function render() {
    doms.forEach((g, i) => { g.style.display = on.has(i) ? "" : "none"; g.classList.toggle("down", fallen.has(i)); });
    ghost.setAttribute("x", sx(cur) - 6);
    ghost.style.display = document.activeElement === svg ? "" : "none";
    tipB.disabled = busy || on.size === 0; standB.disabled = busy || fallen.size === 0; clearB.disabled = busy || on.size === 0;
  }
  function standUp() { fallen.clear(); }
  function toggle(i, mode) {
    if (busy) return;
    if (fallen.size) standUp();
    const want = mode === null ? !on.has(i) : mode;
    if (want) on.add(i); else on.delete(i);
    rung = false;
    say(on.size + (on.size === 1 ? " is standing." : " are standing."));
    render();
  }
  function idx(e) {
    const r = svg.getBoundingClientRect();
    return Math.max(0, Math.min(N - 1, Math.round(((e.clientX - r.left) * 480 / r.width - 30) / 21)));
  }
  svg.addEventListener("pointerdown", (e) => {
    if (busy) return;
    e.preventDefault(); svg.focus({ preventScroll: true });
    const i = idx(e); cur = i; paint = !on.has(i);
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    toggle(i, paint);
  });
  svg.addEventListener("pointermove", (e) => { if (paint === null) return; const i = idx(e); if (i !== cur) { cur = i; toggle(i, paint); } });
  const stop = () => { paint = null; };
  svg.addEventListener("pointerup", stop); svg.addEventListener("pointercancel", stop);
  svg.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End") {
      e.preventDefault();
      cur = e.key === "Home" ? 0 : e.key === "End" ? N - 1 : Math.max(0, Math.min(N - 1, cur + (e.key === "ArrowLeft" ? -1 : 1)));
      render();
      live.textContent = "Place " + (cur + 1) + " of " + N + ": " + (on.has(cur) ? "standing" : "empty");
    } else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(cur, null); }
  });
  svg.addEventListener("focus", render); svg.addEventListener("blur", render);

  function tip() {
    if (busy || !on.size) return;
    keep(tipB);
    if (fallen.size) standUp();
    const list = [...on].sort((a, b) => a - b), chain = chainOf(list);
    busy = true; rung = false; say("Here it goes."); render();
    chain.forEach((d, k) => timers.push(setTimeout(() => { fallen.add(d); render(); }, k * 110)));
    timers.push(setTimeout(() => {
      busy = false;
      const last = chain[chain.length - 1], all = chain.length === list.length;
      if (N - last <= GAP) {
        document.getElementById("bell").classList.remove("ring"); void svg.getBoundingClientRect(); document.getElementById("bell").classList.add("ring");
        const r = svg.getBoundingClientRect(); burst(r.left + r.width * .94, r.top + r.height * .6, 24);
        say(chain.length + " fell and the last one rang the bell. Ding.", true);
      } else if (chain.length === 1) say("Just the one. It lay down.");
      else if (all) say("All " + chain.length + " fell. The bell is still waiting.");
      else say(chain.length + " fell. Then a gap, and " + (list.length - chain.length) + " stayed up.");
      render();
    }, chain.length * 110 + 300));
  }
  tipB.addEventListener("click", tip);
  standB.addEventListener("click", () => { keep(standB); standUp(); rung = false; say("Back up. " + on.size + (on.size === 1 ? " is" : " are") + " standing."); render(); });
  clearB.addEventListener("click", () => { keep(clearB); standUp(); on.clear(); say("The floor is bare. Put a few down."); render(); });
  build(); render();
</script>
</body>
</html>

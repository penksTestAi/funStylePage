<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed · games and stuff</title>
<style>

  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .feed { max-width: 420px; margin: 8px auto 0; padding: 0; list-style: none; text-align: left; }
  .post { background: var(--soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
  .post h2 { font-size: 1rem; margin: 0 0 2px; }
  .post p { margin: 0; }
  .post small { opacity: .75; }
  .batch { text-align: center; font-size: .8rem; opacity: .65; margin: 12px 0 0; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A phone showing three cards, with a fourth card that looks exactly like the first sliding in underneath">
    <rect x="62" y="8" width="76" height="104" rx="10" fill="#fff" stroke="currentColor" stroke-width="2.5"/>
    <g class="bob"><rect x="72" y="20" width="56" height="18" rx="4" fill="#1a6ef0"/><rect x="72" y="44" width="56" height="18" rx="4" fill="#ffb020"/><rect x="72" y="68" width="56" height="18" rx="4" fill="#ff5c8a"/></g>
    <g class="pulse"><rect x="72" y="92" width="56" height="14" rx="4" fill="#1a6ef0"/></g>
    <path d="M160 40v36m-6-6l6 6 6-6" fill="none" stroke="#2bb673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="roll"/>
    <path d="M10 114h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Feed</h1><p class="blurb">There is always more. It is mostly this.</p>
<div class="goal" id="goal"></div>
<ul class="feed" id="feed" aria-label="Posts"></ul>
<div class="row"><button type="button" id="more" aria-describedby="msg">Load more</button></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Click, or Tab, Enter and Space. Nothing is sent or kept.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>


  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  // Each load: [title of post 1, likes 1, text of post 2, tag of post 3, message]
  const LOADS = [
    ["Sunrise over the car park", 12, "Soup, again.", "Does anyone know a good plumber?", "Three posts. Good start."],
    ["Sunrise over the car park", 13, "Soup, again. (edited)", "Does anyone know a good plumber?", "Three more. They look familiar. They are new."],
    ["Sunrise over the car park (2)", 13, "Soup, again. Sponsored.", "Does anyone know a good plumber?", "Three more. One is now an advert for itself."],
    ["Sunrise over the car park", 14, "Soup, again. Again.", "Does anyone know a good plumber? Update: no.", "Three more. The plumber has not replied."],
    ["Sunrise over the car park", 14, "Soup.", "Does anyone know a good plumber?", "Three more. The soup has stopped saying again."],
  ];
  let n, done;
  function post(t, body, meta) {
    const li = document.createElement("li");
    li.className = "post";
    const h = document.createElement("h2"); h.textContent = t;
    const p = document.createElement("p"); p.textContent = body;
    const s = document.createElement("small"); s.textContent = meta;
    li.append(h, p, s);
    return li;
  }
  function add(i) {
    const L = LOADS[Math.min(i, LOADS.length - 1)];
    const f = $("feed");
    f.append(post(L[0], "Just the car park, early.", L[1] + " likes \u00b7 just now"));
    f.append(post("Lunch", L[2], "3 likes \u00b7 just now"));
    f.append(post("Neighbourhood", L[3], "0 likes \u00b7 just now"));
    const li = document.createElement("li");
    li.className = "batch";
    li.textContent = "\u2014 batch " + (i + 1) + " \u2014";
    f.append(li);
    while (f.children.length > 8) f.removeChild(f.firstChild);
  }
  function press() {
    if (done) return;
    n++;
    if (n <= LOADS.length) {
      add(n - 1);
      $("msg").textContent = LOADS[n - 1][4];
    } else {
      done = true;
      add(n - 1);
      $("more").textContent = "That is all of it";
      $("more").setAttribute("aria-disabled", "true");
      $("goal").textContent = "You reached the end.";
      $("msg").textContent = "It was three posts. You have now seen them " + (n * 1) + " times, slightly different each time.";
    }
    $("more").scrollIntoView && $("more").scrollIntoView({ block: "nearest" });
  }
  $("more").onclick = press;
  function start() {
    n = 0; done = false;
    $("feed").innerHTML = "";
    $("more").removeAttribute("aria-disabled");
    $("more").textContent = "Load more";
    $("goal").textContent = "Reach the end of the feed.";
    $("msg").textContent = "";
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

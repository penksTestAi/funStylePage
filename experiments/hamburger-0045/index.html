<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamburger · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .bar { position: relative; display: flex; align-items: center; height: 64px; background: var(--soft); border-radius: 8px; margin: 20px auto 0; max-width: 360px; padding: 0 12px; text-align: left; }
  .bar b { margin-left: 12px; }
  .burger { width: 48px; height: 48px; padding: 0; margin: 0; display: grid; place-content: center; gap: 6px; transition: transform .35s ease; }
  .burger i { display: block; width: 26px; height: 3px; border-radius: 2px; background: var(--on-accent); transition: transform .3s ease, opacity .3s ease; }
  .burger.x i:nth-child(1) { transform: translateY(9px) rotate(45deg); }
  .burger.x i:nth-child(2) { opacity: 0; }
  .burger.x i:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
  .menu { list-style: none; margin: 4px auto 0; padding: 0; max-width: 360px; background: var(--soft); border-radius: 8px; text-align: left; overflow: hidden; max-height: 0; visibility: hidden; transition: max-height .3s ease, visibility .3s; }
  .menu.open { max-height: 260px; visibility: visible; }
  .menu li { padding: 12px 16px; border-top: 2px solid var(--paper); }
  .menu li:first-child { border-top: 0; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A browser bar with a three-line menu icon sliding away from a small cursor">
    <g class="wobble"><rect x="20" y="22" width="160" height="76" rx="8" class="sheet" stroke="currentColor" stroke-width="2.5"/><path d="M20 44h160" stroke="currentColor" stroke-width="2"/></g>
    <g class="roll"><rect x="34" y="54" width="34" height="6" rx="3" fill="#ffb020" stroke="currentColor" stroke-width="2"/><rect x="34" y="66" width="34" height="6" rx="3" fill="#2bb673" stroke="currentColor" stroke-width="2"/><rect x="34" y="78" width="34" height="6" rx="3" fill="#ffb020" stroke="currentColor" stroke-width="2"/></g>
    <g class="bob"><path d="M128 60l0 22 6-5 5 11 5-2-5-11 8-1z" fill="#1a6ef0" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></g>
    <circle cx="30" cy="33" r="3" fill="#ff5c8a"/><circle cx="40" cy="33" r="3" fill="#ffb020"/>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Hamburger</h1><p class="blurb">A menu icon. It has not agreed to open.</p>
<div class="goal" id="goal"></div>
<div class="bar"><button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button><b>Shop</b></div>
<ul class="menu" id="menu"></ul>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Click, or Tab, Enter and Space.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>

  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  const ITEMS = ["Home", "Things", "Other things", "Contact"];
  let n, done, timer;
  function items(list) {
    $("menu").innerHTML = "";
    list.forEach((t) => { const li = document.createElement("li"); li.textContent = t; $("menu").appendChild(li); });
  }
  function setOpen(o) {
    $("menu").classList.toggle("open", o);
    $("burger").setAttribute("aria-expanded", o);
  }
  function press() {
    if (done) return;
    n++;
    clearTimeout(timer);
    const b = $("burger");
    b.style.transform = "";
    if (n === 1) {
      const dx = 150 + Math.random() * 60;
      b.style.transform = "translateX(" + dx + "px)";
      $("msg").textContent = "It moved. Menus do that.";
    } else if (n === 2) {
      b.classList.add("x");
      $("msg").textContent = "Closed. It was not open. Now it is more closed.";
    } else if (n === 3) {
      b.classList.remove("x");
      items(ITEMS); setOpen(true);
      $("msg").textContent = "Open!";
      timer = setTimeout(() => { setOpen(false); $("msg").textContent = "You blinked. It shut."; }, 450);
    } else if (n === 4) {
      items(["Close menu"]); setOpen(true);
      $("msg").textContent = "Open, with one option.";
    } else if (n === 5) {
      items([]); setOpen(true);
      $("msg").textContent = "The items are on a break. Back in a bit.";
    } else {
      done = true;
      items(ITEMS); setOpen(true); b.classList.add("x");
      $("goal").textContent = "Open.";
      $("msg").textContent = ITEMS.join(", ") + ". Worth it?";
      const r = b.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2);
    }
  }
  $("burger").onclick = press;
  function start() {
    clearTimeout(timer);
    n = 0; done = false;
    $("burger").style.transform = "";
    $("burger").classList.remove("x");
    items([]); setOpen(false);
    $("goal").textContent = "Open the menu.";
    $("msg").textContent = "";
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue 15 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .spin { animation: spin 5s linear infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  .spin, .roll, .pulse { transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  .shuffle { animation: shuffle 2.4s ease-in-out infinite alternate; }
  .note { animation: rise 2.6s ease-in-out infinite; }
  .shuffle, .note { transform-box: fill-box; transform-origin: center; }
  @keyframes shuffle { to { transform: translateX(10px); } }
  @keyframes rise { 0% { transform: translateY(8px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }
  .line { max-width: 460px; margin: 16px auto; text-align: left; }
  .pos { text-align: center; font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pos small { display: block; font-size: .95rem; font-weight: 400; opacity: .7; }
  .screen { background: var(--soft); border: 2px solid var(--ink); border-radius: 8px; padding: 12px; min-height: 5.5em; font-family: ui-monospace, Menlo, Consolas, monospace; line-height: 1.5; margin: 12px 0; overflow-wrap: anywhere; }
  .screen .music { display: block; opacity: .75; font-size: .9rem; }
  .screen.done { outline: 3px solid #2bb673; outline-offset: 2px; }
  .menu { display: flex; flex-direction: column; gap: 8px; }
  .menu button { text-align: left; margin: 0; }
  .menu button b { display: inline-block; min-width: 1.6em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A desk phone with a curly cord, a line of small paper people waiting beside it, and music notes floating up">
    <rect x="52" y="64" width="96" height="40" rx="8" fill="#ffb020" stroke="currentColor" stroke-width="2"/>
    <rect x="58" y="50" width="84" height="14" rx="7" fill="var(--soft)" stroke="currentColor" stroke-width="2"/>
    <circle cx="100" cy="86" r="14" fill="var(--paper)" stroke="currentColor" stroke-width="2"/>
    <path d="M100 86 m-8 0 h16 M100 78 v16" stroke="currentColor" stroke-width="1.5"/>
    <path d="M52 84 q-14 4 -14 12 q0 8 14 6" fill="none" stroke="currentColor" stroke-width="2"/>
    <g class="shuffle"><circle cx="20" cy="22" r="5" fill="#ff5c8a" stroke="currentColor" stroke-width="1.5"/><path d="M12 40 q8 -12 16 0 z" fill="#ff5c8a" stroke="currentColor" stroke-width="1.5"/></g>
    <g class="shuffle d2"><circle cx="36" cy="22" r="5" fill="#2bb673" stroke="currentColor" stroke-width="1.5"/><path d="M28 40 q8 -12 16 0 z" fill="#2bb673" stroke="currentColor" stroke-width="1.5"/></g>
    <path class="note" d="M150 40 v-16 l8 -3 v14" fill="none" stroke="#1a6ef0" stroke-width="2" stroke-linecap="round"/>
    <path class="note d2" d="M168 36 v-14 l7 -3 v12" fill="none" stroke="#1a6ef0" stroke-width="2" stroke-linecap="round"/>
    <path class="note d3" d="M130 34 v-12 l6 -2 v10" fill="none" stroke="#1a6ef0" stroke-width="2" stroke-linecap="round"/>
  </svg></div>
<h1>Queue 15</h1><p class="blurb">Your call is important to us. Please stay on the line.</p>
<section class="line" aria-label="Support queue">
  <div class="pos"><span id="pos">12</span><small id="eta">callers ahead of you: 11</small></div>
  <div class="screen" id="screen" aria-hidden="true"><span id="say"></span><span class="music" id="music"></span></div>
  <div class="menu" id="menu"></div>
  <div class="row"><button type="button" id="reset" class="ghost" hidden>Call back</button></div>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="back" href="../../">← all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const MUSIC = ["♪ la-la-laa, la-la-laa ♪", "♪ a flute, thinking about it ♪", "♪ the same eight bars, again ♪", "♪ something with a harp, regrettably ♪", "♪ la-la-laa, la-la... laa ♪"];
  const SAY = [
    "Your call is important to us.",
    "Your call is very important to us. Please continue to be important.",
    "We are experiencing normal call volume, which is a lot.",
    "Did you know you can find answers on our website? Neither did we.",
    "Your estimated wait time is a number, and it is not small.",
    "Thank you for holding. Holding is going well."
  ];
  // d = change to your place in line. Backward moves are limited, so the line always ends.
  const POOL = [
    { k: "Press 1 to keep holding", d: -1, r: "You are holding. Excellent form." },
    { k: "Press 2 for a callback in 3 to 5 business eras", d: -3, r: "Callback booked. You are now ahead of three people who also booked callbacks." },
    { k: "Press 3 to hear our hold music in a different key", d: 2, r: "The music is now in a different key. You were moved back out of respect." },
    { k: "Press 4 to speak to someone about your wait", d: -2, r: "That someone is on hold too. You swapped places." },
    { k: "Press 5 to rate your experience so far", d: 3, r: "Thank you. Your rating has been placed behind you, and so have you." },
    { k: "Press 6 if your call is about a call", d: -2, r: "Calls about calls go to a shorter line. It is the same line, but shorter." },
    { k: "Press 7 to confirm you are still there", d: -1, r: "You are. Noted." },
    { k: "Press 8 for our menu in its original language", d: 2, r: "The original language is hold music. You were sent to the back of that." },
    { k: "Press 9 to hear these options again", d: 0, r: "These options again. They were not different. Your place is the same, it just feels longer." }
  ];
  const START = 12, BACK_LIMIT = 4;
  const pos = document.getElementById("pos"), eta = document.getElementById("eta"), say = document.getElementById("say");
  const music = document.getElementById("music"), menu = document.getElementById("menu"), screen = document.getElementById("screen");
  const resetBtn = document.getElementById("reset"), live = document.getElementById("live");
  let place = START, backs = 0, turn = 0, over = false;

  function pick() {
    const hold = POOL[0];
    // Only moves that still leave a way out are offered; the first option is always a step forward.
    const rest = POOL.slice(1).filter((o) => o.d <= 0 || (backs < BACK_LIMIT && place + o.d <= START + 2));
    const chosen = [hold];
    let idx = (turn * 3) % rest.length;
    while (chosen.length < 3 && chosen.length <= rest.length) {
      const o = rest[idx % rest.length];
      if (!chosen.includes(o)) chosen.push(o);
      idx++;
    }
    return chosen;
  }
  function show(reply) {
    pos.textContent = place;
    eta.textContent = place === 1 ? "you are next" : "callers ahead of you: " + (place - 1);
    say.textContent = reply || SAY[0];
    music.textContent = MUSIC[turn % MUSIC.length];
    menu.textContent = "";
    pick().forEach((o) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = "<b></b>";
      b.querySelector("b").textContent = o.k.slice(6, 7);
      b.append(o.k.slice(8).replace(/^./, (c) => c.toUpperCase()));
      b.addEventListener("click", () => choose(o));
      menu.appendChild(b);
    });
    live.textContent = (reply ? reply + " " : "") + "Place " + place + ". " + SAY[turn % SAY.length];
  }
  function choose(o) {
    turn++;
    if (o.d > 0) backs++;
    place = Math.max(1, place + o.d);
    if (place === 1 && o.d <= 0 && turn > 1) { return connect(); }
    show(o.r + " " + SAY[turn % SAY.length]);
    menu.querySelector("button").focus(); // the menu is rebuilt, so keep keyboard focus on it
  }
  function connect() {
    over = true;
    pos.textContent = "0";
    eta.textContent = "connected";
    say.textContent = "Hello, you have reached support. You are the first person today to get through. How can I help? ... Oh. That is on our website. Goodbye.";
    music.textContent = "(no music)";
    menu.textContent = "";
    screen.classList.add("done");
    resetBtn.hidden = false;
    live.textContent = "Connected. " + say.textContent;
  }
  resetBtn.addEventListener("click", () => {
    place = START; backs = 0; turn = 0; over = false;
    screen.classList.remove("done"); resetBtn.hidden = true;
    show(); menu.querySelector("button").focus();
  });
  show();
</script>
</body>
</html>

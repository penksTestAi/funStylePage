<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rating 25 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  button:focus-visible, .slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button[aria-disabled="true"] { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }

  .rock, .sag { transform-box: fill-box; transform-origin: center; }
  .rock { animation: rock 4s ease-in-out infinite; }
  .sag { animation: sag 3s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes rock { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes sag { 0%,100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .panel { max-width: 460px; margin: 16px auto; }
  .ask { background: var(--soft); border-radius: 8px; padding: 10px 12px; min-height: 2.6em; }
  .card { background: var(--soft); border: 2.5px solid var(--ink); border-radius: 16px; padding: 14px; margin: 12px 0; }
  .stars { display: flex; justify-content: center; gap: 2px; margin: 8px 0; }
  .star { position: relative; width: 48px; height: 48px; padding: 0; margin: 0; background: none; border: 0; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .star svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .star .fill { position: absolute; inset: 0; overflow: hidden; width: 0; }
  .star .fill svg { width: 48px; }
  .num { font-size: 1.4rem; font-weight: 700; margin: 0; }
  .count { opacity: .8; margin: 8px 0 0; font-size: .9rem; }
  .words { min-height: 1.5em; opacity: .85; margin: 8px 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A stapler with a row of five stars above it, one of them slowly drooping">
    <g class="rock"><rect x="40" y="82" width="120" height="14" rx="4" fill="#1a6ef0" stroke="currentColor" stroke-width="2.5"/>
    <path d="M44 82 L150 62 L156 74 L156 82 Z" fill="#ff5c8a" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></g>
    <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M34 28 l4 9 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z" fill="#ffb020"/>
      <path d="M70 28 l4 9 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z" fill="#ffb020"/>
      <path d="M106 28 l4 9 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z" fill="#ffb020"/>
      <path d="M142 28 l4 9 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z" fill="#ffb020"/>
      <g class="sag"><path d="M178 28 l4 9 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z" fill="#e7e7e7"/></g>
    </g>
  </svg></div>
<h1>Rating 25</h1><p class="blurb" id="blurb">Five stars, sincerely meant.</p>
<section class="panel" aria-label="Stapler review">
  <div class="ask" id="ask">Hand stapler, grey. How was it?</div>
  <div class="card">
    <div class="stars" id="stars" role="radiogroup" aria-label="Your rating of the stapler"></div>
    <p class="num" id="num">3.8 out of 5</p>
    <p class="count" id="count"></p>
  </div>
  <div class="row">
    <button type="button" id="post" hidden>Post review</button>
    <button type="button" id="again" class="ghost" hidden>Another stapler</button>
  </div>
  <p class="words" id="done" hidden></p>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const $ = (id) => document.getElementById(id);
  const STAR = "M24 4 l6 13 14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2z";
  const items = ["Hand stapler, grey.", "Desk lamp, bendy.", "Mug, white, chipped.", "Chair, mostly a chair."];
  const START = [3.8, 3.4, 4.1, 3.6];
  let it = 0, avg = START[0], mine = 0, tries = 0, over = false, timer = 0, shown = START[0];
  const stars = $("stars"), btns = [];
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "star"; b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", "false"); b.setAttribute("aria-label", i + " star" + (i > 1 ? "s" : ""));
    b.tabIndex = i === 1 ? 0 : -1;
    b.innerHTML = '<svg viewBox="0 0 48 48"><path d="' + STAR + '" fill="var(--paper)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>' +
      '<span class="fill"><svg viewBox="0 0 48 48"><path d="' + STAR + '" fill="#ffb020" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></span>';
    b.onclick = () => rate(i);
    b.onkeydown = (e) => {
      const m = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!m) return;
      e.preventDefault();
      const n = Math.max(0, Math.min(4, i - 1 + m));
      btns.forEach((x, k) => x.tabIndex = k === n ? 0 : -1);
      btns[n].focus();
    };
    stars.appendChild(b); btns.push(b);
  }
  function paint(v) {
    btns.forEach((b, k) => { b.querySelector(".fill").style.width = Math.max(0, Math.min(1, v - k)) * 100 + "%"; });
    $("num").textContent = v.toFixed(1) + " out of 5";
  }
  function say(m) { $("ask").textContent = m; $("live").textContent = m; }
  function blurb() { $("blurb").textContent = "Five stars, sincerely meant. Shown as " + START[it].toFixed(1) + "."; }
  function glide(from, to) {
    clearInterval(timer);
    if (calm()) { shown = to; paint(to); return; }
    let n = 0;
    timer = setInterval(() => { n++; shown = from + (to - from) * Math.min(1, n / 20); paint(shown); if (n >= 20) clearInterval(timer); }, 40);
  }
  const lines = [
    (m, a) => "You gave it " + m + ". It has been weighted against 1,204 people who own this item and never use it. Now " + a.toFixed(1) + ".",
    (m, a) => m + " noted, and gently corrected. " + a.toFixed(1) + ".",
    (m, a) => "The stars saw your " + m + " and sat down again. " + a.toFixed(1) + ".",
    (m, a) => "Very strong feelings. Rounded to " + a.toFixed(1) + " for everyone's comfort.",
    (m, a) => "Mm. " + a.toFixed(1) + "."
  ];
  function rate(v) {
    if (over) return;
    mine = v; tries++;
    btns.forEach((b, k) => { b.setAttribute("aria-checked", String(k + 1 === v)); b.tabIndex = k + 1 === v ? 0 : -1; });
    const before = avg;
    avg = Math.round((avg + (v - avg) * 0.1) * 10) / 10;
    clearInterval(timer);
    shown = v; paint(v);
    setTimeout(() => glide(v, avg), calm() ? 0 : 500);
    const m = v + " star" + (v > 1 ? "s" : "");
    say(lines[(tries - 1) % lines.length](m, avg));
    $("count").textContent = "You have rated this " + tries + " time" + (tries === 1 ? "" : "s") + ". It was " + before.toFixed(1) + ".";
    $("post").hidden = tries < 3;
  }
  $("post").onclick = () => {
    over = true; $("post").hidden = true; $("again").hidden = false;
    $("done").hidden = false;
    $("done").textContent = "Posted as review 1,205. It appears under \u201chelpful\u201d, between a 3 and a 4. The " + items[it].toLowerCase().replace(/\.$/, "") + " is " + avg.toFixed(1) + ".";
    say($("done").textContent);
    $("again").focus();
  };
  $("again").onclick = () => {
    it = (it + 1) % items.length; avg = START[it]; tries = 0; mine = 0; over = false;
    btns.forEach((b, k) => { b.setAttribute("aria-checked", "false"); b.tabIndex = k === 0 ? 0 : -1; });
    $("done").hidden = true; $("again").hidden = true; $("post").hidden = true; $("count").textContent = "";
    paint(avg); blurb(); say(items[it] + " How was it?"); btns[0].focus();
  };
  blurb();
  paint(avg);
</script>
</body>
</html>

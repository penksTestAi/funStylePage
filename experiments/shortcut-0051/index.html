<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortcuts 51 · games and stuff</title>
<style>

  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .hero .body { fill: var(--wall); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 3.6em; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .keys { max-width: 360px; margin: 16px auto 0; min-height: 132px; box-sizing: border-box; text-align: left; }
  .keys h2 { font-size: 1rem; margin: 0 0 8px; }
  .keys ul { list-style: none; margin: 0; padding: 0; }
  .keys li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0; }
  kbd { font: inherit; font-size: .9rem; padding: 2px 8px; border-radius: 5px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); overflow-wrap: anywhere; text-align: right; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A keyboard with a few keys, one of them pressed down, and a small question mark floating over it">
    <rect class="body" x="22" y="52" width="156" height="52" rx="8" stroke="currentColor" stroke-width="2.5"/>
    <rect x="32" y="62" width="20" height="14" rx="3" class="sheet" stroke="currentColor" stroke-width="2"/>
    <rect x="58" y="62" width="20" height="14" rx="3" class="sheet" stroke="currentColor" stroke-width="2"/>
    <g class="pulse"><rect x="84" y="62" width="20" height="14" rx="3" fill="#ffb020" stroke="currentColor" stroke-width="2"/></g>
    <rect x="110" y="62" width="20" height="14" rx="3" class="sheet" stroke="currentColor" stroke-width="2"/>
    <rect x="136" y="62" width="30" height="14" rx="3" class="sheet" stroke="currentColor" stroke-width="2"/>
    <rect x="44" y="84" width="112" height="12" rx="3" class="sheet" stroke="currentColor" stroke-width="2"/>
    <g class="bob"><circle cx="100" cy="28" r="15" fill="#1a6ef0" stroke="currentColor" stroke-width="2"/><text x="100" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" font-family="Roboto, system-ui, sans-serif">?</text></g>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Shortcuts 51</h1><p class="blurb">Press ? for the shortcuts. They have been rearranged.</p>
<div class="goal" id="goal"></div>
<div class="card keys" id="keys"><h2>Keyboard shortcuts</h2><ul><li><span>Save the note</span><kbd id="k0">?</kbd></li><li><span>Undo</span><kbd id="k1">?</kbd></li><li><span>Print</span><kbd id="k2">?</kbd></li></ul></div>
<div class="row"><button type="button" id="show" aria-describedby="msg">Show shortcuts</button></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Click, or Tab, Enter and Space, or press ?. Nothing is sent or kept.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  // Each press: [save, undo, print, message]. The list is right only on the last press.
  const STEPS = [
    ["Ctrl+Z", "Ctrl+P", "Ctrl+S", "Save is Ctrl+Z. Try it."],
    ["Alt+F4", "Ctrl+S", "Ctrl+Z", "Tried Ctrl+Z. It undid the shortcuts, then listed them again."],
    ["Ctrl+Shift+Esc", "Alt+F4", "Ctrl+S", "Tried Alt+F4. The note is still open. The list is not."],
    ["F1", "Ctrl+Shift+Esc", "Alt+F4", "Tried Ctrl+Shift+Esc. A task manager opened for the note."],
    ["Ctrl+Shift+S, maybe", "F1", "Ctrl+P", "Tried F1. Help is on its way, for the note."],
    ["Ctrl+S", "Ctrl+Z", "Ctrl+P", "Tried Ctrl+S. Saved. It was Ctrl+S the whole time."],
  ];
  let n;
  function show(i) {
    const st = STEPS[i];
    for (let k = 0; k < 3; k++) $("k" + k).textContent = st[k];
    $("msg").textContent = st[3];
  }
  function press() {
    if ($("show").getAttribute("aria-disabled") === "true") return;
    show(n); n++;
    if (n === STEPS.length) {
      $("goal").textContent = "Saved.";
      $("show").setAttribute("aria-disabled", "true");
      $("show").textContent = "Saved";
    } else {
      $("goal").textContent = "Save the note.";
    }
  }
  $("show").onclick = press;
  document.addEventListener("keydown", (e) => {
    if (e.key === "?" && !e.ctrlKey && !e.altKey && !e.metaKey && !e.repeat) {
      e.preventDefault();
      if ($("show").getAttribute("aria-disabled") === "true") return;
      press();
      const r = $("show").getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
    }
  });
  function start() {
    n = 0;
    $("show").removeAttribute("aria-disabled");
    $("show").textContent = "Show shortcuts";
    for (let k = 0; k < 3; k++) $("k" + k).textContent = "?";
    $("goal").textContent = "Save the note.";
    $("msg").textContent = "";
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

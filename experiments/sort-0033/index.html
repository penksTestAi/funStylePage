<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .spin { animation: spin 5s linear infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .drop { animation: drop 1.4s linear infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  .bob, .spin, .roll, .wobble, .pulse, .drop { transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes drop { 0% { transform: translateY(-8px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet, .hero .tab { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }


  .list { list-style: none; max-width: 440px; margin: 16px auto 8px; padding: 0; text-align: left; position: relative; }
  .list li { display: flex; align-items: center; gap: 10px; background: var(--soft); border: 2px solid var(--ink); border-radius: 8px; padding: 12px 14px; margin: 8px 0; cursor: grab; touch-action: none; user-select: none; transition: transform .35s ease, background .2s; }
  .list li .n { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 1.4em; }
  .list li .grip { margin-left: auto; opacity: .5; letter-spacing: -2px; }
  .list li.drag { cursor: grabbing; background: var(--paper); box-shadow: 0 6px 16px rgba(0,0,0,.25); transition: none; position: relative; z-index: 3; }
  .list li.held { background: var(--paper); outline: 3px solid var(--accent); }
  .list li:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .list.mine li { border-color: var(--accent); }
  .rule { min-height: 1.6em; font-weight: 700; }
  .pat { display: flex; justify-content: center; gap: 6px; margin: 8px 0; }
  .pat i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--accent); }
  .pat i.off { background: transparent; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; }

</style>
</head>
<body>
<main>
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A clipboard with a list whose rows keep shuffling, and a small hand pointing at it">
    <rect x="50" y="12" width="100" height="98" rx="8" fill="#fff" stroke="currentColor" stroke-width="2.5"/>
    <rect x="80" y="6" width="40" height="14" rx="5" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/>
    <g class="roll"><rect x="62" y="34" width="60" height="14" rx="4" fill="#1a6ef0" stroke="currentColor" stroke-width="2"/></g>
    <g class="pulse"><rect x="62" y="58" width="76" height="14" rx="4" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/></g>
    <g class="bob"><rect x="62" y="82" width="76" height="14" rx="4" fill="#2bb673" stroke="currentColor" stroke-width="2"/></g>
    <g class="wobble"><path d="M160 92c0-6 4-8 8-8s6 3 6 8v10c0 6-4 8-8 8s-6-3-6-8z" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/></g>
  </svg></div>
<h1>Sort</h1><p class="blurb">Drag a task. The list knows better.</p>
<div class="rule" id="rule" aria-live="polite">Sorted by: your order, for now</div>
<div class="pat" id="pat" role="img" aria-label="Helper patience"></div>
<ul class="list" id="list" aria-label="To-do list"></ul>
<div class="hint">Drag, or Tab to a task, press Space, use the arrow keys, press Space again.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  const TASKS = ["Do the taxes", "Buy stamps", "Learn the cello", "Email the landlord", "Water the plant"];
  const URG = { "Water the plant": 0, "Do the taxes": 1, "Email the landlord": 2, "Buy stamps": 3, "Learn the cello": 4 };
  const DREAD = { "Do the taxes": 0, "Email the landlord": 1, "Learn the cello": 2, "Buy stamps": 3, "Water the plant": 4 };
  const RULES = [
    ["alphabet", (a, b) => a.localeCompare(b)],
    ["shortest first", (a, b) => a.length - b.length || a.localeCompare(b)],
    ["urgency (a guess)", (a, b) => URG[a] - URG[b]],
    ["most dreaded first", (a, b) => DREAD[a] - DREAD[b]],
    ["reverse alphabet", (a, b) => b.localeCompare(a)]
  ];
  const MAX = RULES.length;
  const LINES = ["Tidied it for you.", "Better.", "You are welcome.", "Almost there. You were not.", "Fine."];
  let order, used, won, held = null, busy = false;
  const sr = (t) => { $("msg").textContent = t; };
  const list = $("list");

  function pat() {
    const p = $("pat");
    p.textContent = "";
    for (let i = 0; i < MAX; i++) { const d = document.createElement("i"); if (i < used) d.className = "off"; p.appendChild(d); }
    p.setAttribute("aria-label", "Helper patience: " + (MAX - used) + " of " + MAX);
  }
  let rendering = false;
  function render(focusText) {
    rendering = true;
    const pos = new Map([...list.children].map((li) => [li.dataset.t, li.getBoundingClientRect().top]));
    list.textContent = "";
    order.forEach((t, i) => {
      const li = document.createElement("li");
      li.tabIndex = 0;
      li.dataset.t = t;
      li.setAttribute("aria-label", t + ", position " + (i + 1) + " of " + order.length);
      const n = document.createElement("span"); n.className = "n"; n.textContent = (i + 1) + ".";
      const s = document.createElement("span"); s.textContent = t;
      const g = document.createElement("span"); g.className = "grip"; g.setAttribute("aria-hidden", "true"); g.textContent = "::";
      li.append(n, s, g);
      list.appendChild(li);
    });
    list.classList.toggle("mine", won);
    // slide rows from where they were
    if (!calm()) [...list.children].forEach((li) => {
      const old = pos.get(li.dataset.t);
      if (old === undefined) return;
      const dy = old - li.getBoundingClientRect().top;
      if (!dy) return;
      li.style.transition = "none";
      li.style.transform = "translateY(" + dy + "px)";
      requestAnimationFrame(() => requestAnimationFrame(() => { li.style.transition = ""; li.style.transform = ""; }));
    });
    rendering = false;
    if (focusText) { const f = [...list.children].find((li) => li.dataset.t === focusText); if (f) { f.focus({ preventScroll: true }); if (held === focusText) f.classList.add("held"); } }
  }
  function settle(moved) {
    if (!moved || won) return;
    used++;
    pat();
    const [name, cmp] = RULES[used - 1];
    if (used >= MAX) {
      won = true;
      $("rule").textContent = "Sorted by: you";
      sr("Okay. Your order. It stays. The list will not touch it again.");
      confetti(window.innerWidth / 2, 200);
      render(document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.t : null);
      return;
    }
    busy = true;
    $("rule").textContent = "Sorted by: " + name + " (helpful)";
    const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.t : null;
    setTimeout(() => {
      order = order.slice().sort(cmp);
      sr(LINES[used - 1] + " " + (MAX - used) + " more of your changes until it gives up.");
      render(focused);
      busy = false;
    }, calm() ? 0 : 650);
  }
  function indexFromY(y, dragged) {
    const lis = [...list.children].filter((li) => li !== dragged);
    let i = 0;
    lis.forEach((li) => { const r = li.getBoundingClientRect(); if (y > r.top + r.height / 2) i++; });
    return i;
  }
  let drag = null;
  list.addEventListener("pointerdown", (e) => {
    const li = e.target.closest("li");
    if (!li || busy || drag || e.button) return;
    drag = { li, t: li.dataset.t, start: [...order], y0: e.clientY, id: e.pointerId };
    li.classList.add("drag");
    li.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  list.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const li = drag.li;
    li.style.transform = "translateY(" + (e.clientY - drag.y0) + "px)";
    const to = indexFromY(e.clientY, li);
    const from = order.indexOf(drag.t);
    if (to !== from) {
      // move in the DOM and keep the dragged row under the pointer
      const before = li.getBoundingClientRect().top;
      order.splice(from, 1);
      order.splice(to, 0, drag.t);
      const ref = [...list.children].filter((x) => x !== li)[to] || null;
      list.insertBefore(li, ref);
      const after = li.getBoundingClientRect().top;
      drag.y0 += after - before;
      li.style.transform = "translateY(" + (e.clientY - drag.y0) + "px)";
      [...list.children].forEach((x, i) => { x.firstChild.textContent = (i + 1) + "."; });
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    d.li.classList.remove("drag");
    d.li.style.transform = "";
    const moved = d.start.join("|") !== order.join("|");
    render();
    settle(moved);
  }
  list.addEventListener("pointerup", endDrag);
  list.addEventListener("pointercancel", endDrag);

  list.addEventListener("keydown", (e) => {
    const li = e.target.closest("li");
    if (!li || busy) return;
    const t = li.dataset.t;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (held === t) {
        held = null;
        li.classList.remove("held");
        const moved = heldStart.join("|") !== order.join("|");
        sr("Dropped " + t + " at position " + (order.indexOf(t) + 1) + ".");
        settle(moved);
      } else {
        held = t; heldStart = [...order];
        li.classList.add("held");
        sr("Holding " + t + ". Arrow keys move it. Space drops it.");
      }
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      const i = order.indexOf(t);
      const j = i + (e.key === "ArrowUp" ? -1 : 1);
      if (j < 0 || j >= order.length) return;
      if (held === t) {
        order.splice(i, 1); order.splice(j, 0, t);
        render(t);
        sr(t + " is now position " + (j + 1) + ".");
      } else {
        const sib = list.children[j];
        if (sib) sib.focus();
      }
    } else if (e.key === "Escape" && held === t) {
      // cancel: put it back where it was, without a helper turn
      order = heldStart.slice(); held = null;
      render(t);
      sr(t + " goes back to position " + (order.indexOf(t) + 1) + ".");
    }
  });
  let heldStart = [];
  list.addEventListener("focusout", (e) => {
    // leaving a held task drops it, so the change still counts
    if (held && !rendering && !list.contains(e.relatedTarget)) {
      const moved = heldStart.join("|") !== order.join("|");
      held = null;
      render();
      settle(moved);
    }
  });

  function start() {
    order = TASKS.slice(); used = 0; won = false; held = null; busy = false;
    $("rule").textContent = "Sorted by: your order, for now";
    pat(); render(); sr("");
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

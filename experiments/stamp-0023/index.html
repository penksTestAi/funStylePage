<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp 23 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  button:focus-visible, .slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }

    .steam { animation: steam 2.4s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .thump { animation: thump 1.6s ease-in-out infinite; }
  .d2 { animation-delay: .45s; }
  .steam, .pulse, .thump { transform-box: fill-box; transform-origin: center; }
  @keyframes steam { 0%,100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-5px); opacity: .4; } }
  @keyframes thump { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(6px); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  .panel { max-width: 460px; margin: 16px auto; }
  .ask { background: var(--soft); border-radius: 8px; padding: 10px 12px; min-height: 2.6em; }
  .card { background: #ffb020; color: #111; border: 2.5px solid var(--ink); border-radius: 12px; padding: 14px 12px; margin: 12px 0; }
  .card h2 { font-size: 1rem; margin: 0 0 4px; letter-spacing: .04em; text-transform: uppercase; }
  .goal { font-weight: 700; min-height: 1.5em; margin: 0 0 10px; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .slot { margin: 0; padding: 0; aspect-ratio: 1; border-radius: 50%; border: 2px dashed #111; background: #fff8e6; color: #111; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1; }
  .slot.on { background: #ff5c8a; border-style: solid; }
  .slot.free { border-style: solid; border-width: 3px; background: #fff; }
  .slot.on.free { background: #2bb673; }
  .slot:focus-visible { outline: 3px solid #1a6ef0; outline-offset: 2px; }
  .count { opacity: .8; margin: 8px 0 0; font-size: .9rem; }
  .words { min-height: 1.5em; opacity: .85; margin: 8px 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A loyalty card with a few round stamps, a rubber stamp coming down on it, and a steaming coffee cup">
    <rect x="14" y="26" width="112" height="74" rx="8" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="36" cy="50" r="8" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/>
    <circle cx="62" cy="50" r="8" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/>
    <circle cx="88" cy="50" r="8" fill="var(--paper)" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="36" cy="78" r="8" fill="var(--paper)" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="62" cy="78" r="8" fill="var(--paper)" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="88" cy="78" r="8" fill="var(--paper)" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
    <g class="thump"><rect x="80" y="14" width="16" height="9" rx="2" fill="#1a6ef0" stroke="currentColor" stroke-width="2"/><rect x="85" y="6" width="6" height="9" rx="2" fill="currentColor"/></g>
    <path d="M146 62 h34 v18 a14 14 0 0 1 -14 14 h-6 a14 14 0 0 1 -14 -14 Z" fill="var(--paper)" stroke="currentColor" stroke-width="2.5"/>
    <path d="M180 68 q12 2 0 14" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path class="steam" d="M156 54 q-5 -7 0 -12 M168 54 q-5 -7 0 -12" fill="none" stroke="#1a6ef0" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Stamp 23</h1><p class="blurb" id="blurb">Ten stamps for a free coffee. Probably.</p>
<section class="panel" aria-label="Loyalty card">
  <div class="ask" id="ask">Welcome back. Your card is ready.</div>
  <div class="card">
    <h2>Loyal Beans · Rewards</h2>
    <p class="goal" id="goal"></p>
    <div class="slots" id="slots" role="group" aria-label="Stamp slots. Arrow keys move between slots, Enter stamps the next one."></div>
    <p class="count" id="count"></p>
  </div>
  <div class="row">
    <button type="button" id="buy">Buy a coffee</button>
    <button type="button" id="again" class="ghost" hidden>New card</button>
  </div>
  <p class="words" id="done" hidden>Free coffee. The card has been retired, with honours.</p>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="back" href="../../">← all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const $ = (id) => document.getElementById(id);
  const N = 15;
  // where the free coffee sits after 0, 1, 2... stamps
  const LINE = [10, 12, 11, 13, 12, 14, 13, 12, 12, 11, 9];
  const WORDS = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen"];
  $("blurb").textContent = WORDS[LINE[0]] + " stamps for a free coffee. Probably.";
  const notes = [
    "", "The barista initials the card. “Terms.”", "“Seasonal adjustment.”", "“It was a leap-year card.”",
    "“We rounded it for you.”", "“Premium beans are premium.”", "“Almost there. Almost.”", "“A price is a mood.”",
    "“We hear you.”", "“Nearly.”", "“Oh, you're early.”"
  ];
  let k = 0, over = false, cur = 0;
  const slots = [];
  for (let i = 0; i < N; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.tabIndex = i === 0 ? 0 : -1;
    b.addEventListener("click", () => { cur = i; if (i === k) stamp(); else if (!over) say(i < k ? "That one is already stamped." : "Stamps go in order, like trains and regrets."); });
    $("slots").appendChild(b); slots.push(b);
  }
  const T = () => LINE[Math.min(k, LINE.length - 1)];
  function say(m) { $("ask").textContent = m; $("live").textContent = m; }
  function draw() {
    slots.forEach((b, i) => {
      b.classList.toggle("on", i < k);
      b.classList.toggle("free", i === T() - 1);
      b.textContent = i === T() - 1 ? "FREE" : (i < k ? "\u2713" : i + 1);
      b.setAttribute("aria-label", "Slot " + (i + 1) + (i < k ? ", stamped" : (i === k && !over ? ", next" : "")) + (i === T() - 1 ? ", free coffee" : ""));
    });
    $("goal").textContent = "Free coffee at stamp " + T() + ".";
    $("count").textContent = k + " stamp" + (k === 1 ? "" : "s") + ", " + Math.max(0, T() - k) + " to go.";
  }
  function stamp() {
    if (over) return;
    const before = T();
    k++;
    const t = T();
    if (k >= t) {
      over = true; draw();
      $("done").hidden = false; $("again").hidden = false; $("buy").disabled = true;
      say("Stamp " + k + ". Free coffee at last. The card says " + t + ", you have " + k + ".");
      $("again").focus();
      return;
    }
    draw();
    const d = t - before;
    say("Stamp " + k + ". Free coffee is now at " + t + (d > 0 ? ", " + d + " further." : d < 0 ? ", " + (-d) + " closer." : ", where it was.") + " " + notes[Math.min(k, notes.length - 1)]);
  }
  $("buy").onclick = () => { cur = Math.min(k, N - 1); stamp(); };
  $("slots").addEventListener("keydown", (e) => {
    const m = { ArrowRight: 1, ArrowDown: 5, ArrowLeft: -1, ArrowUp: -5 }[e.key];
    let n = cur;
    if (m) n = Math.max(0, Math.min(N - 1, cur + m));
    else if (e.key === "Home") n = 0; else if (e.key === "End") n = N - 1; else return;
    e.preventDefault();
    cur = n; slots.forEach((b, i) => b.tabIndex = i === n ? 0 : -1); slots[n].focus();
  });
  $("slots").addEventListener("focusin", (e) => { const i = slots.indexOf(e.target); if (i >= 0) { cur = i; slots.forEach((b, j) => b.tabIndex = j === i ? 0 : -1); } });
  $("again").onclick = () => {
    over = false; k = 0; cur = 0; $("done").hidden = true; $("again").hidden = true; $("buy").disabled = false;
    draw(); say("A new card. Free coffee at " + T() + ". For now."); slots[0].focus();
  };
  draw();
</script>
</body>
</html>

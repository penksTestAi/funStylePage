<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; }
  button:focus-visible, .val:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; max-width: 320px; margin: 20px auto 8px; }
  .stepper button { font-size: 1.6rem; width: 56px; height: 56px; padding: 0; margin: 0; }
  .val { min-width: 96px; font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 6px; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A number box with a minus and a plus button, the number sliding sideways as if it is trying to leave, and a small worried pencil tally beside it">
    <g class="wobble"><rect x="30" y="38" width="140" height="44" rx="8" class="sheet" stroke="currentColor" stroke-width="2.5"/><path d="M100 38v44" stroke="currentColor" stroke-width="2"/></g>
    <g class="pulse"><circle cx="50" cy="60" r="13" fill="#ff5c8a" stroke="currentColor" stroke-width="2.5"/><path d="M44 60h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g>
    <g class="pulse"><circle cx="150" cy="60" r="13" fill="#2bb673" stroke="currentColor" stroke-width="2.5"/><path d="M144 60h12M150 54v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g>
    <g class="roll"><path d="M82 48h14l-12 24M104 48h16l-16 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="bob"><path d="M40 100h8M52 100h8M64 100h8M76 100h8M38 106l50-12" fill="none" stroke="#1a6ef0" stroke-width="2.5" stroke-linecap="round"/></g>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Stepper</h1><p class="blurb">A number field. Plus and minus are suggestions.</p>
<div class="goal" id="goal"></div>
<div class="card stepper">
  <button type="button" id="minus" aria-label="Decrease">&minus;</button>
  <div class="val" id="val" role="spinbutton" tabindex="0" aria-label="Quantity" aria-valuenow="0" aria-valuemin="-99" aria-valuemax="99"></div>
  <button type="button" id="plus" aria-label="Increase">+</button>
</div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Click, or Tab, arrows, Enter and Space.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  const GOAL = 7;
  let v, n, done;
  // Press n (1-based) -> [multiplier on the direction asked, message]. Press 8 onwards is honest.
  const RULES = [
    null,
    [1, ""],
    [2, "Skipped one. It was not using it."],
    [-1, "Wrong way. I decide the direction."],
    [10, "Counting in tens now. It is faster."],
    [0, "No."],
    [-1, "Reversed. For balance."],
    [3, "Three at once. A bulk discount."]
  ];
  function show() {
    $("val").textContent = v;
    $("val").setAttribute("aria-valuenow", v);
  }
  function step(d) {
    if (done) return;
    n++;
    const rule = RULES[n];
    if (rule) {
      v += rule[0] * d;
      $("msg").textContent = v === GOAL ? "Seven? Not yet. It is not ready." : rule[1];
    } else {
      v += d;
      if (v === GOAL) {
        done = true;
        $("goal").textContent = GOAL + ".";
        $("msg").textContent = "Seven. Counted properly. Once.";
        show();
        const r = $("val").getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2);
        return;
      }
      $("msg").textContent = n === 8 ? "Fine. Honest from here. Do not get used to it." : "";
    }
    v = Math.max(-99, Math.min(99, v));
    show();
  }
  $("plus").onclick = () => step(1);
  $("minus").onclick = () => step(-1);
  $("val").addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  });
  function start() {
    v = 0; n = 0; done = false;
    $("goal").textContent = "Make it " + GOAL + ".";
    $("msg").textContent = "";
    show();
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

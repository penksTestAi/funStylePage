<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangle 16 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .spin { animation: spin 5s linear infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  .spin, .roll, .pulse { transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  .sway { animation: sway 3.2s ease-in-out infinite alternate; }
  .bud { animation: bob 2.4s ease-in-out infinite alternate; }
  .sway, .bud { transform-box: fill-box; transform-origin: center; }
  @keyframes sway { to { transform: rotate(2.5deg) translateY(2px); } }
  @keyframes bob { to { transform: translateY(5px); } }
  .stage { max-width: 500px; margin: 16px auto; }
  #cv { width: 100%; height: auto; cursor: grab; display: block; }
  #cv:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #cv.drag { cursor: grabbing; }
  .status { min-height: 1.5em; margin: 12px 0 4px; }
  .status.done { color: #2bb673; font-weight: 700; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="Two earbuds on a cable that loops into a loose knot in the middle">
    <path class="sway" d="M30 30 C60 60 40 100 80 90 C120 80 70 40 110 50 C150 60 130 100 170 30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M80 90 C100 112 140 92 120 72 C108 62 92 74 100 84" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <g class="bud"><circle cx="30" cy="28" r="9" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/><circle cx="30" cy="28" r="3" fill="var(--paper)"/></g>
    <g class="bud d2"><circle cx="170" cy="28" r="9" fill="#1a6ef0" stroke="currentColor" stroke-width="2"/><circle cx="170" cy="28" r="3" fill="var(--paper)"/></g>
    <rect x="94" y="78" width="12" height="12" rx="3" fill="#ffb020" stroke="currentColor" stroke-width="2" transform="rotate(-20 100 84)"/>
  </svg></div>
<h1>Tangle 16</h1><p class="blurb">It was in your pocket for four minutes.</p>
<section class="stage" aria-label="Earbud cable">
  <canvas id="cv" width="480" height="300" tabindex="0" role="img" aria-label="A knotted earbud cable. Drag it apart. Arrow keys move the grabbed plug. Home picks the pink plug, End the blue one."></canvas>
  <p class="status" id="status">Mostly one knot.</p>
  <div class="row"><button type="button" id="again" class="ghost">Pocket it</button></div>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const status = document.getElementById("status"), live = document.getElementById("live"), again = document.getElementById("again");
  const W = cv.width, H = cv.height, N = 40, L = 10, TOTAL = (N - 1) * L, GOAL = TOTAL * 0.92;
  let P = [], grab = -1, done = false, t = 0;

  function coil() {
    // walk a tight, wandering loop so the cable starts as a blob
    P = []; let x = W / 2, y = H / 2, a = Math.random() * 6.28;
    for (let i = 0; i < N; i++) {
      P.push({ x, y, px: x, py: y });
      a += 0.8 + Math.sin(i * 0.9) * 0.9;
      x += Math.cos(a) * L; y += Math.sin(a) * L;
      x = Math.min(W - 20, Math.max(20, x)); y = Math.min(H - 20, Math.max(20, y));
    }
    P.forEach((p) => { p.px = p.x; p.py = p.y; });
  }
  function span() { return Math.hypot(P[0].x - P[N - 1].x, P[0].y - P[N - 1].y); }
  function step() {
    t++;
    const cx = P.reduce((s, p) => s + p.x, 0) / N, cy = P.reduce((s, p) => s + p.y, 0) / N + 6;
    P.forEach((p, i) => {
      if (i === grab) return;
      let vx = (p.x - p.px) * 0.9, vy = (p.y - p.py) * 0.9;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + 0.02;
      // slack curls back on itself, very gently, when nothing holds it taut
      if (grab < 0 && !calm()) {
        const k = 0.0009 * (1 - Math.min(1, span() / TOTAL));
        p.x += (cx - p.x) * k * 6; p.y += (cy - p.y) * k * 6;
        p.x += Math.sin(t * 0.02 + i * 1.7) * 0.03; p.y += Math.cos(t * 0.017 + i * 1.3) * 0.03;
      }
    });
    for (let it = 0; it < 10; it++) {
      for (let i = 0; i < N - 1; i++) {
        const a = P[i], b = P[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, f = (d - L) / d / 2;
        const fa = i === grab ? 0 : 1, fb = i + 1 === grab ? 0 : 1, s = fa + fb;
        if (!s) continue;
        a.x += dx * f * 2 * fa / s; a.y += dy * f * 2 * fa / s;
        b.x -= dx * f * 2 * fb / s; b.y -= dy * f * 2 * fb / s;
      }
      P.forEach((p) => { p.x = Math.min(W - 6, Math.max(6, p.x)); p.y = Math.min(H - 6, Math.max(6, p.y)); });
    }
    if (!done && span() >= GOAL) finish();
  }
  function finish() {
    done = true;
    status.textContent = "Untangled. Straight, flat, briefly yours.";
    status.classList.add("done");
    live.textContent = "Untangled.";
    const r = cv.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 22);
  }
  function ink() { return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#111"; }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const c = ink();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = c; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < N - 1; i++) ctx.quadraticCurveTo(P[i].x, P[i].y, (P[i].x + P[i + 1].x) / 2, (P[i].y + P[i + 1].y) / 2);
    ctx.lineTo(P[N - 1].x, P[N - 1].y); ctx.stroke();
    [[0, "#ff5c8a"], [N - 1, "#1a6ef0"]].forEach(([i, col]) => {
      ctx.fillStyle = col; ctx.strokeStyle = c; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P[i].x, P[i].y, 9, 0, 6.283); ctx.fill(); ctx.stroke();
    });
    if (grab >= 0) { ctx.strokeStyle = "#ffb020"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(P[grab].x, P[grab].y, 13, 0, 6.283); ctx.stroke(); }
  }
  function loop() {
    step(); draw();
    if (done && span() < TOTAL * 0.6) { done = false; status.classList.remove("done"); status.textContent = "It is thinking about it again."; }
    requestAnimationFrame(loop);
  }
  function pt(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  function nearest(q) {
    let best = 0, bd = 1e9;
    P.forEach((p, i) => { const d = Math.hypot(p.x - q.x, p.y - q.y) - (i === 0 || i === N - 1 ? 8 : 0); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  function moveGrab(q) { const p = P[grab]; p.x = Math.min(W - 6, Math.max(6, q.x)); p.y = Math.min(H - 6, Math.max(6, q.y)); p.px = p.x; p.py = p.y; }
  cv.addEventListener("pointerdown", (e) => {
    cv.setPointerCapture(e.pointerId); clearTimeout(kt); const q = pt(e); grab = nearest(q); cv.classList.add("drag"); moveGrab(q);
    if (!done) status.textContent = "Hold on.";
  });
  cv.addEventListener("pointermove", (e) => { if (grab >= 0) moveGrab(pt(e)); });
  const drop = () => { grab = -1; cv.classList.remove("drag"); };
  cv.addEventListener("pointerup", drop); cv.addEventListener("pointercancel", drop);
  // keyboard: arrow keys drag the chosen plug (blue by default; Home picks pink, End picks blue); it is held while a key is used, then let go
  let kt = 0, kplug = N - 1;
  cv.addEventListener("keydown", (e) => {
    if (e.key === "Home" || e.key === "End") { e.preventDefault(); kplug = e.key === "Home" ? 0 : N - 1; if (grab >= 0) grab = kplug; return; }
    const d = { ArrowLeft: [-14, 0], ArrowRight: [14, 0], ArrowUp: [0, -14], ArrowDown: [0, 14] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (grab < 0) grab = kplug;
    moveGrab({ x: P[grab].x + d[0], y: P[grab].y + d[1] });
    clearTimeout(kt); kt = setTimeout(() => { grab = -1; }, 700);
  });
  again.addEventListener("click", () => {
    coil(); done = false; grab = -1; status.classList.remove("done"); status.textContent = "Mostly one knot.";
  });
  coil(); loop();
</script>
</body>
</html>

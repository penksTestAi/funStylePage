<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermostat 24 · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626;  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--soft); color: var(--ink); }
  button:focus-visible, .slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button[aria-disabled="true"] { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }

    .spin, .flap, .steam { transform-box: fill-box; transform-origin: center; }
  .spin { animation: spin 6s ease-in-out infinite; }
  .flap { animation: flap 3s ease-in-out infinite; transform-origin: top left; }
  .steam { animation: steam 2.4s ease-in-out infinite; }
  @keyframes spin { 0%,100% { transform: rotate(-50deg); } 50% { transform: rotate(50deg); } }
  @keyframes flap { 0%,100% { transform: rotate(0); } 50% { transform: rotate(4deg); } }
  @keyframes steam { 0%,100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-5px); opacity: .4; } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .panel { max-width: 460px; margin: 16px auto; }
  .ask { background: var(--soft); border-radius: 8px; padding: 10px 12px; min-height: 2.6em; }
  .wall { background: var(--soft); border: 2.5px solid var(--ink); border-radius: 16px; padding: 14px; margin: 12px 0; }
  .lcd { background: #2bb673; color: #111; border: 2px solid var(--ink); border-radius: 6px; font-family: ui-monospace, monospace; padding: 6px; display: flex; justify-content: space-around; font-size: 1.1rem; }
  #dial { display: block; margin: 12px auto; width: 180px; height: 180px; border-radius: 50%; touch-action: none; cursor: grab; }
  #dial:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  #knob { transition: transform .15s ease-out; transform-origin: 90px 90px; }
  .count { opacity: .8; margin: 8px 0 0; font-size: .9rem; }
  .words { min-height: 1.5em; opacity: .85; margin: 8px 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="page">
<div class="hero" id="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A wall thermostat with a dial and a small display, and a sticky note beside it">
    <rect x="62" y="10" width="76" height="100" rx="10" fill="#e7e7e7" stroke="currentColor" stroke-width="2.5"/>
    <rect x="76" y="20" width="48" height="18" rx="3" fill="#2bb673" stroke="currentColor" stroke-width="2"/>
    <circle cx="100" cy="74" r="24" fill="var(--paper)" stroke="currentColor" stroke-width="2.5"/>
    <g class="spin"><line x1="100" y1="74" x2="100" y2="54" stroke="#ff5c8a" stroke-width="4" stroke-linecap="round"/></g>
    <rect x="150" y="30" width="34" height="30" fill="#ffb020" stroke="currentColor" stroke-width="2" class="flap"/>
    <path d="M156 42 h22 M156 50 h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path class="steam" d="M30 80 q-6 -8 0 -14 M42 80 q-6 -8 0 -14" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Thermostat 24</h1><p class="blurb">The dial works perfectly. The office stays 21.</p>
<section class="panel" aria-label="Office thermostat">
  <div class="ask" id="ask">Level 4, east wall. Please adjust to taste.</div>
  <div class="wall">
    <div class="lcd"><span>Set <b id="set">21</b>&deg;</span><span>Room <b id="room">21.0</b>&deg;</span></div>
    <svg id="dial" viewBox="0 0 180 180" role="slider" tabindex="0" aria-label="Temperature dial" aria-valuemin="16" aria-valuemax="28" aria-valuenow="21" aria-valuetext="21 degrees">
      <circle cx="90" cy="90" r="84" fill="var(--paper)" stroke="currentColor" stroke-width="3"/>
      <g id="ticks" stroke="currentColor" stroke-width="2"></g>
      <g id="knob"><circle cx="90" cy="90" r="52" fill="#ffb020" stroke="currentColor" stroke-width="3"/><line x1="90" y1="90" x2="90" y2="48" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
    </svg>
    <p class="count" id="count"></p>
  </div>
  <div class="row">
    <button type="button" id="cooler">Cooler</button>
    <button type="button" id="warmer">Warmer</button>
    <button type="button" id="fix" hidden>Declare it fixed</button>
    <button type="button" id="again" class="ghost" hidden>Next floor</button>
  </div>
  <p class="words" id="done" hidden>Everyone agrees it is much better. It is 21.</p>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, 14);
  });

  const $ = (id) => document.getElementById(id);
  const MIN = 16, MAX = 28, ROOM = 21;
  $("room").textContent = ROOM.toFixed(1);
  let t = 21, lo = false, hi = false, over = false, turns = 0;
  const NS = "http://www.w3.org/2000/svg";
  for (let v = MIN; v <= MAX; v++) {
    const a = ((v - 22) / 12) * 300 * Math.PI / 180;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 90 + Math.sin(a) * 70); l.setAttribute("y1", 90 - Math.cos(a) * 70);
    l.setAttribute("x2", 90 + Math.sin(a) * 80); l.setAttribute("y2", 90 - Math.cos(a) * 80);
    $("ticks").appendChild(l);
  }
  const notes = {
    16: "Someone on level 4 puts on a coat. Room: 21.",
    17: "A cardigan appears. Room: 21.",
    19: "“Better.” Room: 21.",
    21: "Where it started. Room: 21.",
    23: "“Bit stuffy now.” Room: 21.",
    25: "A fan is plugged in. Room: 21.",
    28: "Someone opens a window that does not open."
  };
  const general = ["Click. Room: 21.", "The dial feels very sure of itself. Room: 21.", "Somewhere a vent sighs, as before.", "Noted by no one. Room: 21."];
  function say(m) { $("ask").textContent = m; $("live").textContent = m; }
  function draw() {
    $("set").textContent = t;
    const d = $("dial");
    d.setAttribute("aria-valuenow", t); d.setAttribute("aria-valuetext", t + " degrees");
    $("knob").style.transform = "rotate(" + ((t - 22) / 12 * 300) + "deg)";
    $("count").textContent = "Turned " + turns + " time" + (turns === 1 ? "" : "s") + ". Room temperature: unchanged.";
    // aria-disabled, not disabled: a disabled button drops keyboard focus at the end of the range
    $("cooler").setAttribute("aria-disabled", String(over || t <= MIN)); $("warmer").setAttribute("aria-disabled", String(over || t >= MAX));
    $("fix").hidden = !(lo && hi) || over;
  }
  function set(v, say_) {
    if (over) return;
    v = Math.max(MIN, Math.min(MAX, v));
    if (v === t) return;
    t = v; turns++;
    if (t === MIN) lo = true; if (t === MAX) hi = true;
    const extra = lo && hi ? " Both ends tried. Facilities has left a button." : (lo ? " Now try the other end." : hi ? " Now try the other end." : "");
    say((notes[t] || general[turns % general.length]) + (t === MIN || t === MAX ? extra : ""));
    draw();
  }
  const dial = $("dial");
  dial.addEventListener("keydown", (e) => {
    const m = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (m) { e.preventDefault(); set(t + m); }
    else if (e.key === "Home") { e.preventDefault(); set(MIN); }
    else if (e.key === "End") { e.preventDefault(); set(MAX); }
  });
  function fromPointer(e) {
    const r = dial.getBoundingClientRect();
    let a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
    a = Math.max(-150, Math.min(150, a));
    set(Math.round(22 + a / 300 * 12));
  }
  let drag = false;
  dial.addEventListener("pointerdown", (e) => { drag = true; dial.setPointerCapture(e.pointerId); dial.focus(); fromPointer(e); });
  dial.addEventListener("pointermove", (e) => { if (drag) fromPointer(e); });
  dial.addEventListener("pointerup", () => { drag = false; });
  dial.addEventListener("pointercancel", () => { drag = false; });
  $("cooler").onclick = () => set(t - 1);
  $("warmer").onclick = () => set(t + 1);
  $("fix").onclick = () => {
    over = true; $("done").hidden = false; $("again").hidden = false;
    say("Fixed. Everyone agrees it is much better. It is 21.");
    draw(); $("again").focus();
  };
  $("again").onclick = () => {
    over = false; lo = hi = false; turns = 0; t = 21; $("done").hidden = true; $("again").hidden = true;
    say("Next floor. Same dial."); draw(); dial.focus();
  };
  draw();
</script>
</body>
</html>

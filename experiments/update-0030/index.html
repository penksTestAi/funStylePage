<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .spin { animation: spin 5s linear infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .drop { animation: drop 1.4s linear infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  .bob, .spin, .roll, .wobble, .pulse, .drop { transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes drop { 0% { transform: translateY(-8px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .wall { fill: var(--wall); }
  .hero .panel { fill: var(--panel); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  .twitch-l { animation: twitch-l 3.2s ease-in-out infinite; }
  .twitch-r { animation: twitch-r 3.2s ease-in-out infinite; }
  .twitch-l, .twitch-r { transform-box: fill-box; }
  @keyframes twitch-l { 0%, 70%, 100% { transform: translateX(0); } 76% { transform: translateX(5px); } 82% { transform: translateX(1px); } 88% { transform: translateX(4px); } }
  @keyframes twitch-r { 0%, 70%, 100% { transform: translateX(0); } 76% { transform: translateX(-5px); } 82% { transform: translateX(-1px); } 88% { transform: translateX(-4px); } }

  .door { --gap: 38%; position: relative; display: flex; height: 120px; margin: 16px auto; max-width: 320px; overflow: hidden; border-radius: 6px; background: var(--soft); border: 2px solid var(--ink); }
  .door i { position: absolute; top: 0; bottom: 0; width: 50%; background: var(--panel); transition: transform .5s ease-in-out; }
  .door i:first-child { left: 0; border-right: 2px solid var(--ink); transform: translateX(calc(-1 * var(--gap))); }
  .door i:last-child { right: 0; border-left: 2px solid var(--ink); transform: translateX(var(--gap)); }
  .door.ajar { --gap: 1%; }
  .door.ajar i { transition-duration: .9s; }
  .count { font-size: 1.1rem; font-variant-numeric: tabular-nums; margin: 8px 0; opacity: .75; }
  #press { font-size: 1.5rem; font-weight: 700; padding: 18px 28px; border-radius: 999px; margin: 8px 0; }
  #press:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .msg { min-height: 3.2em; margin: 12px 0; font-size: 1.1rem; }
  @media (prefers-reduced-motion: reduce) { .door i, .door.ajar i { transition: none !important; } }

  .mail { background: var(--soft); border: 3px solid var(--ink); border-radius: 12px; padding: 16px; margin: 16px auto; max-width: 440px; text-align: left; }
  .mail h2 { font-size: 1.2rem; margin: 0 0 4px; }
  .mail p { margin: 4px 0 12px; }
  .lists { list-style: none; margin: 12px 0 0; padding: 0; }
  .lists li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--ink); opacity: .85; font-size: .95rem; }
  .lists li s { opacity: .7; }
  .log li s { white-space: nowrap; }
  .sr-msg { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .lists li.fresh { animation: flash .6s ease-out; }
  .tally { font-size: 1.1rem; font-variant-numeric: tabular-nums; margin: 8px 0; }
  @keyframes flash { from { background: var(--accent); } to { background: transparent; } }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .dlg { background: var(--soft); border: 3px solid var(--ink); border-radius: 12px; padding: 16px; margin: 16px auto; max-width: 440px; text-align: left; }
  .dlg h2 { font-size: 1.3rem; margin: 0 0 6px; }
  .dlg h2:focus { outline: none; }
  .dlg p { margin: 4px 0 12px; }
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #now { font-weight: 700; margin: 0; }
  #later { margin: 0; font-size: calc(1rem * var(--s, 1)); padding: calc(10px * var(--s, 1)) calc(16px * var(--s, 1)); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .opts button { margin: 0; font-size: calc(.95rem * var(--s, 1)); padding: calc(8px * var(--s, 1)) calc(12px * var(--s, 1)); }
  .log { list-style: none; margin: 12px 0 0; padding: 0; font-size: .9rem; }
  .log li { padding: 5px 0; border-top: 1px solid var(--ink); opacity: .8; display: flex; justify-content: space-between; gap: 8px; }
  .done { text-align: center; }
  #msg { min-height: 1.5em; }
</style>
</head>
<body>
<main>
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A window with a circular update arrow, and a clock beside it with a trail of dots that keep getting smaller">
    <g class="bob"><rect x="40" y="16" width="120" height="88" rx="8" fill="#fff" stroke="currentColor" stroke-width="2.5"/>
    <rect x="40" y="16" width="120" height="20" rx="8" fill="#1a6ef0" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="54" cy="26" r="3" fill="#ffb020"/><circle cx="64" cy="26" r="3" fill="#ff5c8a"/></g>
    <g class="spin"><path d="M100 50 a18 18 0 1 1 -17 12" fill="none" stroke="#1a6ef0" stroke-width="5" stroke-linecap="round"/><path d="M78 56 l5 8 l9 -6 z" fill="#1a6ef0"/></g>
    <g class="pulse"><circle cx="172" cy="30" r="9" fill="#ffb020" stroke="currentColor" stroke-width="2"/><path d="M172 25 v5 l3 2" fill="none" stroke="currentColor" stroke-width="1.8"/></g>
    <g class="pulse d2"><circle cx="182" cy="52" r="5" fill="#ffb020" stroke="currentColor" stroke-width="1.6"/></g>
    <g class="pulse d3"><circle cx="188" cy="68" r="2.5" fill="#ffb020" stroke="currentColor" stroke-width="1.2"/></g>
  </svg></div>
<h1>Update</h1><p class="blurb">Restart to finish. Or don't. For now.</p>
<div class="dlg" id="dlg">
 <h2 id="head" tabindex="-1">Restart to update</h2>
 <p id="text"></p>
 <div class="acts">
  <button type="button" id="now">Restart now</button>
  <button type="button" class="ghost" id="later" aria-expanded="false" aria-controls="opts">Remind me later</button>
 </div>
 <ul class="opts" id="opts" hidden></ul>
 <ol class="log" id="log" aria-label="Reminders so far"></ol>
</div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || calm()) return;
    const r = b.getBoundingClientRect();
    const x = e.detail ? e.clientX : r.left + r.width / 2;
    const y = e.detail ? e.clientY : r.top + r.height / 2;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  });

  const $ = (id) => document.getElementById(id);
  // Each round: what the dialog says, and which "Remind me later" options it still offers.
  // The options and the button itself shrink with each round (scale 1 -> 0.55).
  const R = [
    { t: "A restart is needed to finish updating.", o: ["In 1 hour", "Tonight", "Tomorrow", "Next week"] },
    { t: "Reminder: a restart is needed to finish updating.", o: ["In 1 hour", "Tonight", "Tomorrow"] },
    { t: "Reminder: the reminder you postponed is here.", o: ["In 10 minutes", "In 1 hour"] },
    { t: "This is about the update. You know the one.", o: ["In 5 minutes"] },
    { t: "Last reminder. Of the reminders.", o: [] }
  ];
  let i = 0, ended = false;
  const log = [];
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

  function render() {
    const r = R[i];
    $("text").textContent = r.t;
    document.documentElement.style.setProperty("--s", String(Math.max(.55, 1 - i * .11)));
    $("opts").hidden = true;
    $("later").setAttribute("aria-expanded", "false");
    if (r.o.length === 0) {
      $("later").hidden = true;
      $("text").textContent = r.t + " There is no later left.";
    }
    $("opts").replaceChildren(...r.o.map((label) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.className = "ghost";
      b.onclick = () => postpone(label);
      li.appendChild(b);
      return li;
    }));
    $("head").focus();
  }

  $("later").onclick = () => {
    const open = $("opts").hidden;
    $("opts").hidden = !open;
    $("later").setAttribute("aria-expanded", String(open));
    if (open) $("opts").querySelector("button").focus();
  };

  function postpone(label) {
    if (ended) return;
    log.push(label);
    const li = document.createElement("li");
    li.textContent = "Reminded: " + label.toLowerCase() + " ";
    const s = document.createElement("s");
    s.textContent = "restart postponed";
    li.appendChild(s);
    $("log").appendChild(li);
    $("dlg").hidden = true;
    $("msg").textContent = "Okay. We will remind you " + label.toLowerCase() + ".";
    i++;
    setTimeout(() => {
      $("dlg").hidden = false;
      $("msg").textContent = "";
      render();
    }, calm() ? 0 : 900);
  }

  $("now").onclick = () => {
    ended = true;
    const n = log.length;
    $("head").textContent = "Updated";
    $("text").textContent = n === 0
      ? "Restarted at once. Nothing looks different."
      : "Restarted. Nothing looks different. You postponed it " + plural(n, "time") + ".";
    $("now").hidden = true;
    $("later").hidden = true;
    $("opts").hidden = true;
    $("dlg").classList.add("done");
    $("msg").textContent = "Updated. That is the end.";
    $("head").focus();
  };
  render();
</script>
</body>
</html>

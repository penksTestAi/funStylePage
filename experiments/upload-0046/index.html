<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload · games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .zonewrap { max-width: 360px; margin: 20px auto 0; }
  .zone { display: grid; gap: 4px; width: 100%; padding: 36px 16px; margin: 0; border-radius: 12px; background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); transition: transform .35s ease, background .2s; }
  .zone span { opacity: .75; font-size: .9rem; }
  .zone.over { background: var(--wall); }
  .prog { max-width: 360px; height: 14px; margin: 14px auto 0; border-radius: 7px; background: var(--soft); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s ease; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A dashed drop zone with a sheet of paper that hovers above it and a small arrow that never lands">
    <g class="wobble"><rect x="30" y="62" width="140" height="42" rx="8" class="sheet" stroke="currentColor" stroke-width="2.5" stroke-dasharray="8 6"/></g>
    <g class="bob"><path d="M88 18h20l10 10v28H88z" fill="#ffb020" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M108 18v10h10" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <g class="pulse"><path d="M103 66v-14m-6 6l6-7 6 7" fill="none" stroke="#1a6ef0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <circle cx="48" cy="83" r="3" fill="#ff5c8a"/><circle cx="158" cy="83" r="3" fill="#2bb673"/>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Upload</h1><p class="blurb">Drop a file here. It will be looked at.</p>
<div class="goal" id="goal"></div>
<div class="zonewrap"><button type="button" class="zone" id="zone" aria-describedby="msg"><b>Drop a file here</b><span>or click to browse</span></button></div>
<div class="prog" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog"><i id="fill"></i></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Drop, click, or Tab, Enter and Space. No file is read.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>

  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  let n, done;
  function bar(p) { $("fill").style.width = p + "%"; $("prog").setAttribute("aria-valuenow", p); }
  function press() {
    if (done) return;
    n++;
    const z = $("zone");
    z.style.transform = "";
    if (n === 1) {
      z.style.transform = "translateX(" + (Math.random() < .5 ? -1 : 1) * (30 + Math.random() * 20) + "px)";
      $("msg").textContent = "Received. It landed slightly to the side.";
    } else if (n === 2) {
      bar(99);
      $("msg").textContent = "99%. Nearly there. Stay exactly where you are.";
    } else if (n === 3) {
      $("msg").textContent = "Rejected: file too small. There is no file.";
    } else if (n === 4) {
      bar(0);
      $("msg").textContent = "Upload failed. Retrying from 0%.";
    } else if (n === 5) {
      $("msg").textContent = "Please choose a file. You did. Please choose a file.";
    } else {
      done = true;
      bar(100);
      $("goal").textContent = "Uploaded.";
      $("msg").textContent = "0 files, 0 bytes. Nothing left this page.";
      const r = z.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2);
    }
  }
  $("zone").onclick = press;
  const zone = $("zone");
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  // the children of the button fire dragleave too, so only clear the highlight when the pointer really leaves
  zone.addEventListener("dragleave", (e) => { if (!zone.contains(e.relatedTarget)) zone.classList.remove("over"); });
  zone.addEventListener("drop", (e) => { e.preventDefault(); zone.classList.remove("over"); press(); });
  // keep the page from opening a dropped file
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", (e) => e.preventDefault());
  function start() {
    n = 0; done = false;
    $("zone").style.transform = "";
    bar(0);
    $("goal").textContent = "Upload a file.";
    $("msg").textContent = "";
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

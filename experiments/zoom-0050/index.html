<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoom 50 · games and stuff</title>
<style>

  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 2.4em; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .frame { position: relative; max-width: 360px; aspect-ratio: 3 / 2; margin: 12px auto 0; overflow: hidden; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--ink); background: var(--soft); box-sizing: border-box; }
  .frame svg { display: block; width: 100%; height: 100%; transition: transform .7s ease; color: var(--ink); }
  .read { font-variant-numeric: tabular-nums; margin: 8px 0 0; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .frame svg { transition: none; } }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A magnifying glass held over a field, the glass showing only a patch of empty sky while a small dog waits at the side">
    <rect x="14" y="78" width="172" height="30" rx="6" fill="#2bb673" stroke="currentColor" stroke-width="2.5"/>
    <g class="wobble"><path d="M150 96q0-10 8-10t8 6l4-4 2 6q4 0 4 6v6h-26z" fill="#ffb020" stroke="currentColor" stroke-width="2"/></g>
    <circle cx="70" cy="48" r="28" fill="#dfe8f5" stroke="currentColor" stroke-width="2.5"/>
    <g class="bob"><circle cx="70" cy="48" r="28" fill="none" stroke="#1a6ef0" stroke-width="5"/><path d="M90 68l22 22" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></g>
    <circle cx="60" cy="38" r="3" fill="#fff" class="pulse"/>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Zoom 50</h1><p class="blurb">Zoom in on the dog.</p>
<div class="goal" id="goal"></div>
<div class="frame" id="frame"><svg id="scene" viewBox="0 0 300 200" role="img" aria-label="A field with a large tree, a house, a cow and a very small dog near the right edge" style="transform-origin: 50% 50%">
  <rect width="300" height="200" fill="#dfe8f5"/>
  <rect y="110" width="300" height="90" fill="#2bb673"/>
  <circle cx="262" cy="26" r="14" fill="#ffb020" stroke="currentColor" stroke-width="2"/>
  <rect x="44" y="64" width="14" height="60" fill="#c98a4b" stroke="currentColor" stroke-width="2"/>
  <circle cx="51" cy="52" r="34" fill="#1f9d5b" stroke="currentColor" stroke-width="2"/>
  <rect x="120" y="70" width="70" height="52" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/>
  <path d="M114 72l41-30 41 30z" fill="#b9c2cf" stroke="currentColor" stroke-width="2"/>
  <rect x="148" y="94" width="14" height="28" fill="#fff" stroke="currentColor" stroke-width="2"/>
  <g><ellipse cx="82" cy="148" rx="24" ry="13" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="62" cy="140" r="8" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="66" cy="132" r="3" fill="#111"/><circle cx="76" cy="148" r="5" fill="#111"/><path d="M70 158v14M94 158v14" stroke="currentColor" stroke-width="2"/></g>
  <g id="dog"><ellipse cx="242" cy="160" rx="5" ry="3" fill="#c98a4b" stroke="currentColor" stroke-width="1"/><circle cx="247" cy="157" r="2.2" fill="#c98a4b" stroke="currentColor" stroke-width="1"/><path d="M237 159l-3-3" stroke="currentColor" stroke-width="1"/></g>
</svg></div>
<div class="read" id="read" aria-live="off"></div>
<div class="row"><button type="button" id="in" aria-describedby="msg">Zoom in</button><button type="button" id="outb" aria-describedby="msg">Zoom out</button></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="hint">Click, or Tab, Enter and Space. Nothing is sent or kept.</div>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  // Each press: [scale, x%, y%, message]. The control agrees about the direction only at the end.
  const STEPS = [
    [0.6, 50, 50, "Zoomed in. It looks further away, if anything."],
    [2.4, 17, 28, "Zoomed in on the tree. Good tree."],
    [3.2, 28, 74, "Closer. This is the cow, which is not the dog."],
    [4, 92, 8, "Closer still. This is some sky."],
    [0.35, 50, 50, "Zoomed out, to be safe. The dog is in here somewhere."],
  ];
  let n;
  function view(s, x, y) {
    const sc = $("scene");
    sc.style.transformOrigin = x + "% " + y + "%";
    sc.style.transform = "scale(" + s + ")";
    $("read").textContent = "Zoom " + Math.round(s * 100) + "%";
  }
  function press() {
    if (n > STEPS.length) return;
    if (n < STEPS.length) {
      const st = STEPS[n]; n++;
      view(st[0], st[1], st[2]);
      $("msg").textContent = st[3];
    } else {
      n++;
      view(6, 81, 80);
      $("goal").textContent = "The dog.";
      $("msg").textContent = "Right there, the whole time. It was a small dog.";
      $("in").setAttribute("aria-disabled", "true");
      $("outb").setAttribute("aria-disabled", "true");
      $("in").textContent = "Done";
    }
  }
  $("in").onclick = press;
  $("outb").onclick = press;
  function start() {
    n = 0;
    view(1, 50, 50);
    $("in").removeAttribute("aria-disabled");
    $("outb").removeAttribute("aria-disabled");
    $("in").textContent = "Zoom in";
    $("goal").textContent = "Find the dog.";
    $("msg").textContent = "";
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>

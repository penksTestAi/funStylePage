<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>games and stuff</title>
<style>
  :root { --ink: #111; --paper: #fff; --soft: #e7e7e7; --accent: #1a6ef0; --muted: #666; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --soft: #262626; --accent: #6aa8ff; --muted: #aaa; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --soft: #262626; --accent: #6aa8ff; --muted: #aaa; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { text-align: center; padding: 28px 16px 8px; }
  .logo { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 900; letter-spacing: -1px; margin: 0; }
  .logo span { color: var(--accent); }
  .tagline { color: var(--muted); margin: 4px 0 16px; }
  .pumpkin { font-size: 2.2rem; background: none; border: 0; cursor: pointer; padding: 4px; }
  .watered { font-size: .9rem; color: var(--muted); }
  .toolbar { text-align: center; margin: 12px 0 4px; }
  .toolbar button { font: inherit; background: var(--soft); color: var(--ink); border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; max-width: 880px; margin: 16px auto; padding: 0 16px 40px; }
  a.card { display: flex; flex-direction: column; justify-content: flex-end; min-height: 156px; padding: 16px; background: var(--soft); border-radius: 10px; color: var(--ink); text-decoration: none; transition: transform .15s ease; }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); outline: none; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  a.card h2 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.3px; }
  a.card p { margin: 0; color: var(--muted); font-size: .95rem; }
  a.card .tag { align-self: flex-start; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: auto; }
  .empty { text-align: center; color: var(--muted); grid-column: 1 / -1; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 16px 32px; }
  .thumb { height: 104px; margin: -4px 0 8px; color: var(--ink); }
  .thumb svg { width: 100%; height: 100%; }
  a.card:hover .thumb svg { transform: scale(1.04); }
  .thumb svg { transition: transform .2s ease; }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  .spin { animation: spin 5s linear infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .drop { animation: drop 1.4s linear infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  .bob, .spin, .roll, .wobble, .pulse, .drop { transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes drop { 0% { transform: translateY(-8px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1 class="logo">games <span>and</span> stuff</h1>
  <p class="tagline">Small interactive toys. A new one is posted every 2 hours.</p>
  <button class="pumpkin" id="pumpkin" aria-label="Water the pumpkin">🎃</button>
  <div class="watered" id="watered"></div>
</header>

<div class="toolbar"><button id="refresh">Get new posts</button></div>

<main class="grid" id="grid">
  <p class="empty">Loading…</p>
</main>

<footer>
  Posted automatically by GitHub Actions. Nothing here is serious, except the pumpkin.
</footer>

<script>
  // Per-viewer pumpkin counter. localStorage can be blocked, so every access is guarded.
  // The count resets each day, keyed by the local date.
  const KEY = "pumpkin-waterings-" + new Date().toDateString();
  const readCount = () => { try { return Number(localStorage.getItem(KEY)) || 0; } catch { return 0; } };
  const writeCount = (n) => { try { localStorage.setItem(KEY, String(n)); } catch {} };
  const showWatered = (n) => document.getElementById("watered").textContent = "Watered " + n + " time" + (n === 1 ? "" : "s") + " today";
  let waterings = readCount();
  showWatered(waterings);
  document.getElementById("pumpkin").onclick = () => { waterings++; writeCount(waterings); showWatered(waterings); };
  document.getElementById("refresh").onclick = () => location.reload();

  // Experiments are listed newest first in experiments.json, written by scripts/generate.mjs.
  fetch("experiments.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((items) => {
      const grid = document.getElementById("grid");
      if (!items.length) { grid.innerHTML = '<p class="empty">Nothing yet. Check back soon.</p>'; return; }
      grid.innerHTML = "";
      items.forEach((it) => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = "experiments/" + encodeURIComponent(it.slug) + "/";
        a.innerHTML = '<div class="thumb"></div><span class="tag"></span><h2></h2><p></p>';
        // SVG comes from experiments.json, which only the generator writes.
        a.querySelector(".thumb").innerHTML = it.art || "";
        a.querySelector(".tag").textContent = it.type.replace(/-/g, " ");
        a.querySelector("h2").textContent = it.title;
        a.querySelector("p").textContent = it.blurb;
        grid.appendChild(a);
      });
    })
    .catch(() => {
      document.getElementById("grid").innerHTML = '<p class="empty">Could not load the list. Try reloading.</p>';
    });
</script>
</body>
</html>
